<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f6f5fb;color:#1d2226}
header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{font-weight:800;color:#5B2DE8;font-size:20px}.logo span{color:#1d2226;font-weight:500}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:#555}
nav button.on{background:#eee8ff;color:#5B2DE8;font-weight:600}
main{max-width:1100px;margin:16px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:260px 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e0dfdc;border-radius:10px;padding:16px;margin-bottom:12px}
.av{width:44px;height:44px;border-radius:50%;background:#5B2DE8;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.sq{border-radius:8px;background:#334155}
.row{display:flex;gap:12px;align-items:center}.muted{color:#666;font-size:13px}
.btn{background:#5B2DE8;color:#fff;border:0;border-radius:20px;padding:7px 16px;cursor:pointer;font-weight:600}.btn.o{background:#fff;color:#5B2DE8;border:1px solid #5B2DE8}
input,textarea,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit;margin:4px 0 10px}
.tag{background:#f1f5f9;border-radius:12px;padding:2px 10px;font-size:12px;margin-right:4px}
.page{display:none}.page.on{display:block}
.msgs{display:grid;grid-template-columns:260px 1fr;min-height:400px}.msgs .l{border-right:1px solid #eee}
.th{padding:10px;cursor:pointer;border-bottom:1px solid #f0f0f0}.th:hover{background:#f8fafc}
.b{max-width:70%;padding:8px 12px;border-radius:14px;margin:6px 0}.me{background:#5B2DE8;color:#fff;margin-left:auto}.th2{background:#eef2f1}
.note{background:#fef9c3;border:1px solid #fde047;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}

header{background:linear-gradient(90deg,#5B2DE8,#12104F);border:0}.logo{color:#fff}.logo span{color:#c9b2ff}
nav button{color:#e8dcff}nav button.on{background:#fff;color:#5B2DE8}
.hero{background:linear-gradient(135deg,#5B2DE8,#8B3BFF);color:#fff;border-radius:14px;padding:28px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0 0 14px;opacity:.9}.hero .btn{background:#fff;color:#5B2DE8}
.lang{background:#fff!important;color:#5B2DE8!important;border-radius:16px!important;font-weight:700}
.card{transition:box-shadow .15s}.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
[dir=rtl] nav{margin-left:0;margin-right:auto}[dir=rtl] .msgs .l{border-right:0;border-left:1px solid #eee}
[dir=rtl] .me{margin-left:0;margin-right:auto}[dir=rtl] .btn[style*="margin-left:auto"]{margin-left:0!important;margin-right:auto}

.auth{max-width:420px;margin:40px auto}.err{color:#b91c1c;font-size:13px;margin:6px 0}.ok{color:#047857;font-size:13px;margin:6px 0}
.pl{color:inherit;text-decoration:none;font-weight:700}.pl:hover{color:#5B2DE8;text-decoration:underline}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:#666}.tabs button.on{color:#5B2DE8;border-bottom:2px solid #5B2DE8}

async function feed(){$("app").innerHTML=`<div class="card"><textarea id="np" rows="2" placeholder="${t("Share an update...")}"></textarea><button class="btn" onclick="addPost()">${t("Post")}</button></div><div id="posts">Loading...</div>`;loadPosts()}
async function loadPosts(){const {data:ps}=await sb.from("posts").select("id,body,created_at,author_id,profiles(name,kind),likes(user_id)").order("created_at",{ascending:false}).limit(50);
$("posts").innerHTML=(ps||[]).map(p=>{const liked=p.likes.some(l=>l.user_id==me.id);return `<div class="card"><div class="row"><div class="av" style="cursor:pointer" onclick="openUser('${p.author_id}')">${ini(p.profiles.name)}</div><div><b>${lk(p.author_id,p.profiles.name)}</b><div class="muted">${new Date(p.created_at).toLocaleString()}</div></div></div><p>${esc(p.body)}</p><button class="btn ${liked?"":"o"}" onclick="like(${p.id},${liked})">👍 ${p.likes.length}</button> ${p.author_id==me.id?`<button class="btn o" onclick="delPost(${p.id})">${t("Delete")}</button>`:""}</div>`}).join("")||`<div class="card muted">${t("No posts yet. Be the first.")}</div>`}
async function addPost(){const v=$("np").value.trim();if(!v)return;await sb.from("posts").insert({author_id:me.id,body:v});feed()}
async function delPost(id){await sb.from("posts").delete().eq("id",id);loadPosts()}
async function like(id,liked){liked?await sb.from("likes").delete().eq("post_id",id).eq("user_id",me.id):await sb.from("likes").insert({post_id:id,user_id:me.id});loadPosts()}
async function jobs(){$("app").innerHTML=`<div class="card"><input id="q" placeholder="${t("Search jobs (title or company)")}" oninput="loadJobs()"></div><div id="jl">Loading...</div>`;loadJobs()}
async function loadJobs(){const q=($("q")?.value||"").toLowerCase();const {data:js}=await sb.from("jobs").select("*,profiles(name)").order("created_at",{ascending:false});const {data:ap}=await sb.from("applications").select("job_id").eq("applicant_id",me.id);const applied=new Set((ap||[]).map(a=>a.job_id));
const list=(js||[]).filter(j=>(j.title+j.profiles.name).toLowerCase().includes(q));
$("jl").innerHTML=list.map(j=>`<div class="card row"><div class="av sq">${ini(j.profiles.name)}</div><div><b>${esc(j.title)}</b><div class="muted">${lk(j.company_id,j.profiles.name)} · ${esc(j.location||"")} · ${esc(j.job_type||"")}</div><div>${esc(j.description||"")}</div></div>${prof.kind=="person"?`<button class="btn ${applied.has(j.id)?"o":""}" style="margin-left:auto" ${applied.has(j.id)?"disabled":""} onclick="apply(${j.id})">${applied.has(j.id)?t("Applied ✓"):t("Apply")}</button>`:j.company_id==me.id?`<button class="btn o" style="margin-left:auto" onclick="delJob(${j.id})">${t("Remove")}</button>`:""}</div>`).join("")||`<div class="card muted">${t("No jobs yet.")}</div>`}
async function apply(id){await sb.from("applications").insert({job_id:id,applicant_id:me.id});loadJobs()}
async function delJob(id){await sb.from("jobs").delete().eq("id",id);loadJobs()}
function post(){$("app").innerHTML=`<div class="card"><h3 style="margin-top:0">${t("Post a job")}</h3><label>${t("Job title")}</label><input id="jt"><label>${t("Location")}</label><input id="jlo" placeholder="Cairo, Giza, Remote..."><label>${t("Type")}</label><select id="jy"><option value="Full-time">${t("Full-time")}</option><option value="Part-time">${t("Part-time")}</option><option value="Contract">${t("Contract")}</option></select><label>${t("Description")}</label><textarea id="jd" rows="4"></textarea><button class="btn" onclick="addJob()">${t("Publish")}</button></div>`}
async function addJob(){const t=$("jt").value.trim();if(!t)return;await sb.from("jobs").insert({company_id:me.id,title:t,location:$("jlo").value,job_type:$("jy").value,description:$("jd").value});go("jobs")}
async function network(){$("app").innerHTML=`<div class="card"><b>${t("People and companies")}</b><input id="ps" placeholder="${t("Search people and companies")}" oninput="clearTimeout(window._st);window._st=setTimeout(loadPeople,250)"></div><div id="pl">Loading...</div>`;loadPeople()}
async function loadPeople(){const q0=(($("ps")||{}).value||"").trim().replace(/[%,()*]/g," ");let qq=sb.from("profiles").select("id,name,kind,headline,location").neq("id",me.id).limit(100);if(q0)qq=qq.or(`name.ilike.%${q0}%,headline.ilike.%${q0}%,interests.ilike.%${q0}%,about.ilike.%${q0}%,location.ilike.%${q0}%`);const {data:ps}=await qq;const {data:fs}=await sb.from("follows").select("followee_id").eq("follower_id",me.id);const f=new Set((fs||[]).map(x=>x.followee_id));
$("pl").innerHTML=(ps||[]).map(p=>`<div class="card row"><div class="av" style="cursor:pointer" onclick="openUser('${p.id}')">${ini(p.name)}</div><div><b>${lk(p.id,p.name)}</b><div class="muted">${p.kind=="company"?t("Company"):t("Person")}${p.headline?" · "+esc(p.headline):""}</div></div><button class="btn o" style="margin-left:auto" onclick="chatWith='${p.id}';go('msgs')">${t("Message")}</button><button class="btn ${f.has(p.id)?"o":""}" onclick="follow('${p.id}',${f.has(p.id)},'network')">${f.has(p.id)?t("Following"):t("Follow")}</button></div>`).join("")||`<div class="card muted">${t("No one else has joined yet. Invite someone.")}</div>`}
async function follow(id,on,back){on?await sb.from("follows").delete().eq("follower_id",me.id).eq("followee_id",id):await sb.from("follows").insert({follower_id:me.id,followee_id:id});back=="user"?user():loadPeople()}
async function msgs(){const {data:ms}=await sb.from("messages").select("*").order("created_at");const {data:ps}=await sb.from("profiles").select("id,name");const nm=Object.fromEntries((ps||[]).map(p=>[p.id,p.name]));
const th={};(ms||[]).forEach(m=>{const o=m.sender_id==me.id?m.recipient_id:m.sender_id;(th[o]=th[o]||[]).push(m)});if(chatWith&&!th[chatWith])th[chatWith]=[];
const ids=Object.keys(th);if(!chatWith&&ids.length)chatWith=ids[0];
$("app").innerHTML=`<div class="card msgs" style="padding:0"><div class="l">${ids.map(i=>`<div class="th" onclick="chatWith='${i}';msgs()"><b>${esc(nm[i]||"User")}</b></div>`).join("")||`<div class="th muted">${t("No conversations. Use Message on the Network page.")}</div>`}</div><div style="padding:16px;display:flex;flex-direction:column">${chatWith?`<div style="margin-bottom:8px">${lk(chatWith,nm[chatWith]||"User")}</div>`:""}<div style="flex:1">${(th[chatWith]||[]).map(m=>`<div class="b ${m.sender_id==me.id?"me":"th2"}">${esc(m.body)}</div>`).join("")}</div>${chatWith?`<div class="row"><input id="mi" placeholder="${t("Write a message...")}" onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">${t("Send")}</button></div>`:""}</div></div>`}
async function send(){const v=$("mi").value.trim();if(!v||!chatWith)return;await sb.from("messages").insert({sender_id:me.id,recipient_id:chatWith,body:v});msgs()}
async function profile(){const {data:j}=await sb.from("jobs").select("*").eq("company_id",me.id);const {count:fl}=await sb.from("follows").select("*",{count:"exact",head:true}).eq("followee_id",me.id);
$("app").innerHTML=`<div class="card"><div class="row"><div class="av" style="width:80px;height:80px;font-size:28px">${ini(prof.name)}</div><div><h2 style="margin:0">${esc(prof.name)}</h2><div class="muted">${prof.kind=="company"?t("Company"):t("Person")} · ${fl||0} ${t("followers")} · ${esc(me.email)}</div></div></div></div>
<div class="card"><b>${t("Edit profile")}</b><label>${t("Name")}</label><input id="pn" value="${esc(prof.name)}"><label>${t("Headline")}</label><input id="ph" value="${esc(prof.headline||"")}"><label>${t("Location")}</label><input id="pl2" value="${esc(prof.location||"")}"><label>${t("About")}</label><textarea id="pa" rows="3">${esc(prof.about||"")}</textarea><label>${t("Interests (keywords, comma separated). We email you similar jobs.")}</label><input id="pi" placeholder="developer, sales, design" value="${esc(prof.interests||"")}"><label><input type="checkbox" id="pe" style="width:auto" ${prof.email_notify===false?"":"checked"}> ${t("Email me notifications")}</label><div id="pm" class="ok"></div><button class="btn" onclick="saveProf()">${t("Save")}</button></div>${prof.kind=="company"?`<div class="card"><b>${t("Your open jobs")}</b>${(j||[]).map(x=>`<p>${esc(x.title)} <span class="muted">${esc(x.location||"")}</span></p>`).join("")||`<p class="muted">${t("None yet.")}</p>`}</div>`:""}`}
async function saveProf(){const u={name:$("pn").value.trim()||prof.name,headline:$("ph").value,location:$("pl2").value,about:$("pa").value,interests:$("pi").value,email_notify:$("pe").checked};const {error}=await sb.from("profiles").update(u).eq("id",me.id);if(!error)Object.assign(prof,u);$("pm").textContent=error?error.message:t("Saved.");if(error)$("pm").className="err"}
async function user(){const id=viewId;if(id==me.id){return profile()}
$("app").innerHTML='<div class="card">...</div>';
const {data:u}=await sb.from("profiles").select("id,name,kind,headline,location,about,interests").eq("id",id).maybeSingle();
if(!u){$("app").innerHTML=`<div class="card muted">${t("Profile not found.")}</div>`;return}
const [{data:ps},{data:js},{count:fl},{data:fs}]=await Promise.all([sb.from("posts").select("id,body,created_at").eq("author_id",id).order("created_at",{ascending:false}).limit(20),u.kind=="company"?sb.from("jobs").select("*").eq("company_id",id).order("created_at",{ascending:false}):Promise.resolve({data:[]}),sb.from("follows").select("*",{count:"exact",head:true}).eq("followee_id",id),sb.from("follows").select("followee_id").eq("follower_id",me.id).eq("followee_id",id)]);
const f=(fs||[]).length>0;
$("app").innerHTML=`<div class="card"><a href="#" onclick="history.length&&go('network');return false">← ${t("Back")}</a></div>
<div class="card"><div class="row"><div class="av" style="width:80px;height:80px;font-size:28px">${ini(u.name)}</div><div style="flex:1"><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">${u.kind=="company"?t("Company"):t("Person")}${u.location?" · "+esc(u.location):""} · ${fl||0} ${t("followers")}</div><div>${esc(u.headline||"")}</div></div></div>
<div style="margin-top:12px"><button class="btn ${f?"o":""}" onclick="follow('${u.id}',${f},'user')">${f?t("Following"):t("Follow")}</button> <button class="btn o" onclick="chatWith='${u.id}';go('msgs')">${t("Message")}</button></div></div>
${u.about?`<div class="card"><b>${t("About")}</b><p>${esc(u.about)}</p></div>`:""}
${u.interests?`<div class="card"><b>${t("Interests")}</b><p>${u.interests.split(",").filter(x=>x.trim()).map(x=>`<span class="tag">${esc(x.trim())}</span>`).join("")}</p></div>`:""}
${u.kind=="company"?`<div class="card"><b>${t("Open jobs")}</b>${(js||[]).map(j=>`<p><b>${esc(j.title)}</b> <span class="muted">${esc(j.location||"")} · ${esc(j.job_type||"")}</span><br>${esc(j.description||"")}</p>`).join("")||`<p class="muted">${t("None yet.")}</p>`}</div>`:""}
<div class="card"><b>${t("Posts")}</b>${(ps||[]).map(p=>`<p>${esc(p.body)}<br><span class="muted">${new Date(p.created_at).toLocaleString()}</span></p>`).join("")||`<p class="muted">${t("No posts yet.")}</p>`}</div>`}
async function alerts(){const {data:ns}=await sb.from("notifications").select("*").order("created_at",{ascending:false}).limit(50);
$("app").innerHTML=`<div class="card row"><b>${t("Alerts")}</b><button class="btn o" style="margin-inline-start:auto" onclick="readAll()">${t("Mark all read")}</button></div>`+((ns||[]).map(n=>`<div class="card" style="${n.read?"":"border-inline-start:4px solid #5B2DE8"}"><b>${esc(n.title)}</b><div>${esc(n.body||"")}</div><div class="muted">${new Date(n.created_at).toLocaleString()}</div></div>`).join("")||`<div class="card muted">${t("No notifications yet.")}</div>`)}
async function readAll(){await sb.from("notifications").update({read:true}).eq("user_id",me.id).eq("read",false);unread=0;alerts();setNav()}
async function poll(){if(!me)return;const {count}=await sb.from("notifications").select("*",{count:"exact",head:true}).eq("read",false);if(count!==unread){unread=count||0;setNav()}}
setInterval(poll,20000);
init();applyLang();
</script></body></html>
