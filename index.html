function settingsBody(){ $('app').innerHTML=`<div class="card"><h2>${t('Settings')}</h2><p class="muted">${esc(me.email)}</p><label>${lang==='ar'?'اللغة':'Language'}</label><button class="btn o" onclick="toggleLang()">${lang==='ar'?'English':'العربية'}</button></div><div class="card"><h3>${t('Change password')}</h3><label>${t('Current password')}</label><input id="scurrent" type="password" autocomplete="current-password"><label>${t('New password')}</label><input id="snew" type="password" autocomplete="new-password" minlength="8"><label>${t('Confirm password')}</label><input id="sconfirm" type="password" autocomplete="new-password"><button class="btn" onclick="changePassword()">${t('Change password')}</button><div id="spmsg" class="help" role="status"></div></div><div class="card"><h3>${t('Change email')}</h3><p class="help">${lang==='ar'?'ستحتاج إلى تأكيد التغيير عبر البريد. لن يتغير بريدك حتى إتمام التأكيد.':'Confirm the change by email. Your address is not changed until confirmation is complete.'}</p><label>${t('Current password')}</label><input id="sepass" type="password" autocomplete="current-password"><label>${t('New email')}</label><input id="semail" type="email" autocomplete="email"><button class="btn" onclick="changeEmail()">${t('Send confirmation')}</button><div id="semsg" class="help" role="status"></div></div><div class="card" style="border-color:#e8b2be"><h3 style="color:#a52144">${t('Close account')}</h3><p>${lang==='ar'?'حذف نهائي لحسابك وملفك ومنشوراتك ووظائفك وطلباتك ومتابعاتك ورسائلك وملفاتك المرفوعة. لا يمكن التراجع. حمّل نسخة من ملفاتك أولاً.':'Permanently delete your account, profile, posts, jobs, applications, follows, messages and uploaded files. This cannot be undone. Download anything you need first.'}</p><label>${t('Current password')}</label><input id="sdpass" type="password" autocomplete="current-password"><label>${lang==='ar'?'اكتب DELETE للتأكيد':'Type DELETE to confirm'}</label><input id="sdconfirm" autocomplete="off"><button class="btn" style="background:#a52144" onclick="closeAccount()">${t('Permanently delete my account')}</button><div id="sdmsg" class="help" role="status"></div></div><div class="card"><button class="btn o" onclick="logout()">${t('Log out')}</button></div>`}
async function verifyPassword(id){const p=$(id).value;if(!p)throw Error(lang==='ar'?'اكتب كلمة المرور الحالية.':'Enter your current password.');const {error}=await sb.auth.signInWithPassword({email:me.email,password:p});if(error)throw error;$(id).value=''}
async function changePassword(){const m=$('spmsg');try{const password=$('snew').value;if(password.length<8||password!==$('sconfirm').value)throw Error(lang==='ar'?'كلمة المرور ٨ أحرف على الأقل ويجب تطابق التأكيد.':'Use at least 8 characters and matching passwords.');await verifyPassword('scurrent');const {error}=await sb.auth.updateUser({password});if(error)throw error;$('snew').value='';$('sconfirm').value='';m.textContent=t('Saved.')}catch(e){m.textContent=e.message}}
async function changeEmail(){const m=$('semsg');try{const email=$('semail').value.trim();if(!$('semail').checkValidity()||!email||email===me.email)throw Error(lang==='ar'?'اكتب بريداً جديداً صحيحاً.':'Enter a valid new email address.');await verifyPassword('sepass');const {error}=await sb.auth.updateUser({email},{emailRedirectTo:location.origin+location.pathname});if(error)throw error;m.textContent=lang==='ar'?'افتح البريد القديم والجديد وأكّد التغيير.':'Check your old and new inboxes and confirm the change.'}catch(e){m.textContent=e.message}}
async function closeAccount(){const m=$('sdmsg');if($('sdconfirm').value!=='DELETE'){m.textContent=lang==='ar'?'اكتب DELETE للتأكيد.':'Type DELETE to confirm.';return}if(!confirm(lang==='ar'?'هل تريد حذف حسابك وبياناته نهائياً؟':'Permanently delete your account and its data?'))return;try{await verifyPassword('sdpass');m.textContent=lang==='ar'?'جارٍ حذف الملفات والحساب...':'Deleting files and account...';for(const bucket of ['recrova-images','recrova-cvs','recrova-messages']){for(;;){const {data,error}=await sb.storage.from(bucket).list(me.id,{limit:100});if(error)throw error;if(!data?.length)break;const r=await sb.storage.from(bucket).remove(data.map(x=>me.id+'/'+x.name));if(r.error)throw r.error}}const {error}=await sb.rpc('close_my_account');if(error)throw error;await sb.auth.signOut();me=null;prof=null;viewId=null;page='feed';history.replaceState(null,'',location.pathname);render()}catch(e){m.textContent=e.message}}

function recoveryView(){document.body.classList.remove('signed-in');$('nav').style.display='none';$('out').style.display='none';$('app').innerHTML=`<div class="card auth"><h2>${lang==='ar'?'عيّن كلمة مرور جديدة':'Set a new password'}</h2><label>${t('New password')}</label><input id="rpw" type="password" autocomplete="new-password"><label>${t('Confirm password')}</label><input id="rpw2" type="password" autocomplete="new-password"><button class="btn" onclick="saveRecovery()">${t('Save')}</button><div id="rmsg" class="help" role="status"></div></div>`}
async function saveRecovery(){const password=$('rpw').value;if(password.length<8||password!==$('rpw2').value){$('rmsg').textContent=lang==='ar'?'كلمة المرور ٨ أحرف على الأقل ويجب تطابق التأكيد.':'Use at least 8 characters and matching passwords.';return}const {error}=await sb.auth.updateUser({password});if(error){$('rmsg').textContent=error.message;return}recovering=false;await sb.auth.signOut();me=null;prof=null;history.replaceState(null,'',location.pathname);render();$('msg').className='ok';$('msg').textContent=lang==='ar'?'تم تغيير كلمة المرور. سجل الدخول بالجديدة.':'Password changed. Log in with your new password.'}
function photoOptions(){const ar=lang==='ar',d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${ar?'صورة الملف الشخصي':'Profile photo'}</h2><div class="settingslist"><button id="photochange">${ar?'رفع أو تغيير الصورة':'Upload / change photo'}</button>${prof.avatar_path?`<button id="photoremove">${ar?'حذف الصورة':'Remove photo'}</button>`:''}</div><h3>${ar?'إطار الصورة':'Photo frame'}</h3><p class="help">${ar?'يظهر على ملفك ومنشوراتك ونتائج البحث.':'Shown on your profile, posts and search results.'}</p><label for="photoframe">${ar?'اختر الإطار':'Choose frame'}</label><select id="photoframe"><option value="none">${ar?'بدون إطار':'No frame'}</option><option value="open">Open to work</option><option value="hiring">Hiring</option></select><div id="framepreview" class="av" style="width:100px;height:100px;margin:10px auto;font-size:30px"></div><div id="framemsg" class="help" role="status"></div><div class="cropactions"><button class="btn o" id="photocancel">${ar?'إلغاء':'Cancel'}</button><button class="btn" id="photosave">${ar?'حفظ الإطار':'Save frame'}</button></div>`;document.body.appendChild(d);const f=d.querySelector('select');f.value=prof.photo_frame||'none';const preview=()=>d.querySelector('#framepreview').innerHTML=avatar({...prof,photo_frame:f.value});f.onchange=preview;preview();const close=()=>{d.close();d.remove()};d.oncancel=e=>{e.preventDefault();close()};d.querySelector('#photocancel').onclick=close;d.querySelector('#photochange').onclick=()=>{close();$('avatarfile').click()};if(prof.avatar_path)d.querySelector('#photoremove').onclick=()=>{close();removeAvatar()};d.querySelector('#photosave').onclick=async()=>{const b=d.querySelector('#photosave');b.disabled=true;const {error}=await sb.from('profiles').update({photo_frame:f.value}).eq('id',me.id);if(error){d.querySelector('#framemsg').textContent=error.message;b.disabled=false;return}prof.photo_frame=f.value;close();profile()};d.showModal()}

function cropImage(file){return new Promise((resolve,reject)=>{if(!['image/jpeg','image/png','image/webp'].includes(file.type)){reject(Error('JPG, PNG or WebP only.'));return}if(file.size>3*1024*1024){reject(Error('Maximum 3 MB.'));return}let url,img;const ready=()=>{const ar=lang==='ar',d=document.createElement('dialog');d.className='cropdialog';d.setAttribute('aria-labelledby','croptitle');d.innerHTML=`<h2 id="croptitle">${ar?'ضبط صورة الملف الشخصي':'Adjust profile photo'}</h2><p class="help">${ar?'اسحب الصورة لتحريكها. استخدم التكبير لضبط الإطار.':'Drag to reposition. Use zoom to adjust the frame.'}</p><canvas id="cropcanvas" width="600" height="600" aria-label="${ar?'معاينة قص الصورة':'Photo crop preview'}"></canvas><label for="cropzoom">${ar?'التكبير':'Zoom'}</label><input id="cropzoom" type="range" min="1" max="3" step="0.01" value="1"><div class="cropactions"><button class="btn o" id="cropcancel">${ar?'إلغاء':'Cancel'}</button><button class="btn" id="cropuse">${ar?'استخدام الصورة':'Use photo'}</button></div>`;document.body.appendChild(d);const c=d.querySelector('canvas'),ctx=c.getContext('2d'),z=d.querySelector('#cropzoom');let zoom=1,x=0,y=0,drag=null;const base=Math.max(600/(img.naturalWidth||img.width),600/(img.naturalHeight||img.height));function draw(){const w=(img.naturalWidth||img.width)*base*zoom,h=(img.naturalHeight||img.height)*base*zoom;x=Math.min((w-600)/2,Math.max(-(w-600)/2,x));y=Math.min((h-600)/2,Math.max(-(h-600)/2,y));ctx.fillStyle='#fff';ctx.fillRect(0,0,600,600);ctx.drawImage(img,(600-w)/2+x,(600-h)/2+y,w,h);ctx.save();ctx.fillStyle='#11103c65';ctx.beginPath();ctx.rect(0,0,600,600);ctx.arc(300,300,298,0,Math.PI*2,true);ctx.fill('evenodd');ctx.restore()}function finish(v){if(url)URL.revokeObjectURL(url);d.close();d.remove();resolve(v)}z.oninput=()=>{zoom=Number(z.value);draw()};c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:x,oy:y};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;const scale=600/c.getBoundingClientRect().width;x=drag.ox+(e.clientX-drag.x)*scale;y=drag.oy+(e.clientY-drag.y)*scale;draw()};c.onpointerup=c.onpointercancel=()=>{drag=null};d.querySelector('#cropcancel').onclick=()=>finish(null);d.oncancel=e=>{e.preventDefault();finish(null)};d.querySelector('#cropuse').onclick=()=>{const out=document.createElement('canvas');out.width=out.height=600;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,600,600);const w=(img.naturalWidth||img.width)*base*zoom,h=(img.naturalHeight||img.height)*base*zoom;o.drawImage(img,(600-w)/2+x,(600-h)/2+y,w,h);out.toBlob(b=>{if(!b){reject(Error('Could not process photo.'));d.close();d.remove();if(url)URL.revokeObjectURL(url);return}finish(new File([b],'profile-crop.jpg',{type:'image/jpeg'}))},'image/jpeg',0.9)};d.showModal();draw()};createImageBitmap(file).then(b=>{img=b;ready()}).catch(()=>{const reader=new FileReader();img=new Image();img.onload=ready;img.onerror=()=>reject(Error('Could not read this image.'));reader.onerror=()=>reject(Error('Could not read this image.'));reader.onload=()=>{img.src=reader.result};reader.readAsDataURL(file)})})}

function settings(section){if(section===undefined){const q=new URLSearchParams(location.search).get('section');if(q!==null&&/^[0-8]$/.test(q))section=Number(q)}rememberScreen({section:section===undefined?null:section});if(section===0)return languageSettings();if(section===5)return appearanceSettings();if(section===6)return blockedSettings();if(section===7)return activeSettings();if(section===8)return archiveSettings();const ar=lang==='ar';if(section===undefined){const labels=ar?['اللغة','تغيير كلمة المرور','تغيير البريد الإلكتروني','إغلاق الحساب']:['Language','Change password','Change email','Close account'];$('app').innerHTML=`<div class="card"><h2>${t('Settings')}</h2><p class="muted">${esc(me.email)}</p><div class="settingslist">${labels.map((x,i)=>`<button onclick="settings(${i})">${x} <span style="float:inline-end">›</span></button>`).join('')}<button onclick="settings(4)">${ar?'الخصوصية والسيرة الذاتية':'Privacy & private CV'} <span style="float:inline-end">›</span></button><button onclick="settings(5)">${ar?'المظهر':'Appearance'} <span style="float:inline-end">›</span></button><button onclick="settings(6)">${ar?'الأشخاص المحظورون':'Blocked people'} <span style="float:inline-end">›</span></button><button onclick="settings(7)">${ar?'حالة النشاط':'Active status'} <span style="float:inline-end">›</span></button><button onclick="settings(8)">${ar?'الأرشيف':'Archive'} <span style="float:inline-end">›</span></button></div></div>`;return}if(section===4){$('app').innerHTML=cvEditor();loadCV()}else{settingsBody();const cards=Array.from($('app').children);cards.forEach((c,i)=>{if(i!==section)c.remove()})}const b=document.createElement('button');b.className='btn o settingsback';b.textContent=ar?'رجوع إلى الإعدادات':'Back to Settings';b.onclick=()=>settingsRoot();$('app').prepend(b);window.scrollTo(0,0)}
const navIcon=k=>{const paths={feed:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',jobs:'<rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12c5 4 13 4 18 0M12 12v4"/>',network:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-4-5"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',post:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 7v10M7 12h10"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[k]||paths.feed}</svg>`};
function countLinks(id,a,b){return `<button class="countlink" onclick="followList('${id}','followers')"><b>${a||0}</b> ${t('followers')}</button><button class="countlink" onclick="followList('${id}','following')"><b>${b||0}</b> ${lang==='ar'?'يتابع':'following'}</button>`}
async function followList(id,kind){window.fl={id:id,kind:kind||'followers',backPage:page,name:''};page='follows';render();window.scrollTo(0,0)}
function followsBack(){const f=window.fl||{};if(f.backPage==='profile')go('profile');else openUser(f.id)}
async function follows(){const f=window.fl;if(!f){go('feed');return}const ar=lang==='ar';const L={followers:ar?'المتابعون':'Followers',following:ar?'يتابع':'Following'};$('app').innerHTML=`<div class="card"><div class="flhead"><button class="flback" aria-label="Back" onclick="followsBack()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="flname" id="flname"></div></div><div class="fltabs"><button data-k="followers" class="${f.kind==='followers'?'on':''}">${L.followers}</button><button data-k="following" class="${f.kind==='following'?'on':''}">${L.following}</button></div><div class="followpeople" id="flbox">...</div></div>`;document.querySelectorAll('.fltabs button').forEach(b=>b.onclick=()=>{f.kind=b.dataset.k;document.querySelectorAll('.fltabs button').forEach(x=>x.classList.toggle('on',x===b));fillFollows()});const {data:u}=await sb.from('profiles').select('name').eq('id',f.id).maybeSingle();f.name=u?.name||'';const n=$('flname');if(n)n.textContent=f.name;await fillFollows()}
async function fillFollows(){const f=window.fl,kind=f.kind,id=f.id,ar=lang==='ar';const col=kind==='followers'?'follower_id':'followee_id',filter=kind==='followers'?'followee_id':'follower_id';const {data:rows,error}=await sb.from('follows').select(col).eq(filter,id);const box=$('flbox');if(!box)return;if(error){box.textContent=error.message;return}const ids=(rows||[]).map(x=>x[col]);if(!ids.length){box.innerHTML=`<p class="muted flnone">${kind==='followers'?(ar?'لا يوجد متابعون بعد.':'No followers yet.'):(ar?'لا يتابع أحداً بعد.':'Not following anyone yet.')}</p>`;return}const [{data:ps},{data:fs},{data:backs}]=await Promise.all([sb.from('profiles').select('id,name,headline,avatar_path,photo_frame,verified').in('id',ids),sb.from('follows').select('followee_id').eq('follower_id',me.id),sb.from('follows').select('follower_id').eq('followee_id',me.id)]);if(window.fl!==f||f.kind!==kind||!$('flbox'))return;const mine=new Set((fs||[]).map(x=>x.followee_id)),back=new Set((backs||[]).map(x=>x.follower_id));box.innerHTML=(ps||[]).map(p=>`<div class="followrow" onclick="openUser('${p.id}')"><span class="av">${avatar(p)}</span><div class="followname"><span class="pl">${esc(p.name)}${badge(p.verified,p.id)}</span><div class="muted">${esc(p.headline||'')}</div></div>${p.id!==me.id?`<button class="btn o" data-follow="${p.id}" data-on="${mine.has(p.id)}">${mine.has(p.id)?(ar?'إلغاء المتابعة':'Unfollow'):back.has(p.id)?(ar?'متابعة بالمثل':'Follow back'):t('Follow')}</button>`:''}</div>`).join('');box.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async(e)=>{e.stopPropagation();b.disabled=true;const pid=b.dataset.follow,on=b.dataset.on==='true';const {error}=on?await sb.from('follows').delete().eq('follower_id',me.id).eq('followee_id',pid):await sb.from('follows').insert({follower_id:me.id,followee_id:pid});if(error){b.disabled=false;alert(error.message);return}await fillFollows()})}
async function fillFollowList(d,id,kind){const col=kind==='followers'?'follower_id':'followee_id',filter=kind==='followers'?'followee_id':'follower_id';const {data:rows,error}=await sb.from('follows').select(col).eq(filter,id);const box=d.querySelector('.followpeople');if(error){box.textContent=error.message;return}const ids=(rows||[]).map(x=>x[col]);if(!ids.length){box.textContent=lang==='ar'?'لا يوجد بعد.':'None yet.';return}const [{data:ps},{data:fs},{data:backs}]=await Promise.all([sb.from('profiles').select('id,name,headline,avatar_path,photo_frame,verified').in('id',ids),sb.from('follows').select('followee_id').eq('follower_id',me.id),sb.from('follows').select('follower_id').eq('followee_id',me.id)]);const mine=new Set((fs||[]).map(x=>x.followee_id)),back=new Set((backs||[]).map(x=>x.follower_id));box.innerHTML=(ps||[]).map(p=>`<div class="followrow"><a class="av" href="#" onclick="this.closest('dialog').remove();openUser('${p.id}');return false">${avatar(p)}</a><div class="followname"><a class="pl" href="#" onclick="this.closest('dialog').remove();openUser('${p.id}');return false">${esc(p.name)}${badge(p.verified,p.id)}</a><div class="muted">${esc(p.headline||'')}</div></div>${p.id!==me.id?`<button class="btn o" data-follow="${p.id}" data-on="${mine.has(p.id)}">${mine.has(p.id)?(lang==='ar'?'إلغاء المتابعة':'Unfollow'):back.has(p.id)?(lang==='ar'?'متابعة بالمثل':'Follow back'):t('Follow')}</button>`:''}</div>`).join('');box.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{b.disabled=true;const pid=b.dataset.follow,on=b.dataset.on==='true';const {error}=on?await sb.from('follows').delete().eq('follower_id',me.id).eq('followee_id',pid):await sb.from('follows').insert({follower_id:me.id,followee_id:pid});if(error){b.disabled=false;alert(error.message);return}await fillFollowList(d,id,kind)})}

async function alerts(){const {data:ns,error}=await sb.from('notifications').select('*').neq('kind','message').order('created_at',{ascending:false}).limit(50);if(error){$('app').textContent=error.message;return}const ids=[...new Set((ns||[]).map(n=>n.actor_id).filter(Boolean))];const {data:ps}=ids.length?await sb.from('profiles').select('id,name,avatar_path,photo_frame,verified').in('id',ids):{data:[]};const actors=Object.fromEntries((ps||[]).map(p=>[p.id,p]));const {data:myf}=await sb.from('follows').select('followee_id').eq('follower_id',me.id);const myfollowing=new Set((myf||[]).map(f=>f.followee_id));window.alertRows=ns||[];$('app').innerHTML=`<div class="card row"><h2>${t('Alerts')}</h2><button class="btn o" style="margin-inline-start:auto" onclick="readAll()">${t('Mark all read')}</button></div>`+((ns||[]).map(n=>{const a=actors[n.actor_id],click=n.actor_id||n.post_id;return `<div role="${click?'button':'group'}" tabindex="${click?'0':'-1'}" class="card alertrow ${n.read?'':'newalert'}" ${click?`onclick="openAlert(${n.id})"`:''}>${n.kind==='verified'?`<span class="av"><img src="${document.querySelector('header .logo img')?.src||''}" alt="Recrova" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></span>`:a?`<span class="av">${avatar(a)}</span>`:'<span class="alertsymbol">♧</span>'}<span class="alertcopy">${n.kind==='verified'?`<strong>Recrova Talent</strong><br>`:a?`<strong>${esc(a.name)}${badge(a.verified,a.id)}</strong><br>`:''}<span>${esc(n.title)}</span>${n.body?`<span class="muted alertbody">${esc(n.body)}</span>`:''}<small>${fmt12(n.created_at)}</small>${n.kind==='follow'&&a&&a.id!==me.id&&!myfollowing.has(a.id)?`<button class="btn o" onclick="event.stopPropagation();alertFollow('${a.id}',this)">${lang==='ar'?'متابعة بالمثل':'Follow back'}</button>`:''}</span></div>`}).join('')||`<div class="card muted">${t('No notifications yet.')}</div>`);if(page==='alerts'){const ids=(ns||[]).filter(n=>!n.read).map(n=>n.id);if(ids.length){const {error:readError}=await sb.from('notifications').update({read:true}).eq('user_id',me.id).in('id',ids);if(!readError){document.querySelectorAll('.newalert').forEach(e=>e.classList.remove('newalert'));poll()}}}}

async function openAlert(id){const n=(window.alertRows||[]).find(x=>x.id===id);if(!n)return;await sb.from('notifications').update({read:true}).eq('id',id).eq('user_id',me.id);if(n.post_id){page='feed';viewId=null;history.replaceState(null,'',location.pathname+'?post='+n.post_id);render()}else if(n.actor_id)openUser(n.actor_id);poll()}

function actionBar(id,count,liked,isSaved,isRep){const ar=lang==='ar';return `<div class="actcounts"><a href="#" data-likes="${id}" data-n="${count}" onclick="whoLiked('post',${id});return false">${count?'👍 '+count:''}</a></div><div class="actbar"><button class="act ${liked?'on':''}" onclick="like(${id},${liked})">${actInner('👍',ar?'إعجاب':'Like')}</button><button class="act" onclick="comments(${id})">${actInner('💬',ar?'تعليق':'Comment')}</button><button class="act ${isRep?'on':''}" onclick="repost(${id},${isRep})">${actInner('↻',isRep?(ar?'إلغاء':'Undo'):(ar?'إعادة نشر':'Repost'))}</button><button class="act" onclick="sharePost(${id})">${actInner('➤',ar?'إرسال':'Send')}</button><button class="act ${isSaved?'on':''}" onclick="savePost(${id},${isSaved})">${actInner(isSaved?'◆':'◇',isSaved?(ar?'محفوظ':'Saved'):(ar?'حفظ':'Save'))}</button></div>`}
function setLikeUI(id,nl){document.querySelectorAll('button[onclick^="like('+id+',"]').forEach(b=>{b.classList.toggle('on',nl);b.setAttribute('onclick','like('+id+','+nl+')')});document.querySelectorAll('a[data-likes="'+id+'"]').forEach(a=>{const n=Math.max(0,(+a.dataset.n||0)+(nl?1:-1));a.dataset.n=n;a.textContent=n?'👍 '+n:''})}
function sharePost(id){window._conn=null;const ar=lang==='ar',d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${ar?'إرسال المنشور':'Send post'}</h2><input id="spq" placeholder="${ar?'ابحث عن أشخاص':'Search people'}"><div id="spl" style="max-height:34vh;overflow:auto;margin:8px 0"></div><textarea id="spn" rows="2" maxlength="500" placeholder="${ar?'أضف ملاحظة (اختياري)':'Add a note (optional)'}"></textarea><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="spsend">${ar?'إرسال':'Send'}</button><button class="btn o" id="spext">${ar?'مشاركة خارجية':'Share outside'}</button><button class="btn o" onclick="this.closest('dialog').remove()">${t('Cancel')}</button></div><p role="status" id="spst"></p>`;document.body.append(d);d.showModal();const picked=new Set();const load=async()=>{const q=d.querySelector('#spq').value.trim().replace(/[%,()*]/g,' ');if(!window._conn){const [a,b]=await Promise.all([sb.from('follows').select('followee_id').eq('follower_id',me.id),sb.from('follows').select('follower_id').eq('followee_id',me.id)]);window._conn=[...new Set([...(a.data||[]).map(x=>x.followee_id),...(b.data||[]).map(x=>x.follower_id)])].filter(x=>x!==me.id)}let data=[];if(window._conn.length){let qq=sb.from('profiles').select('id,name,headline,avatar_path,photo_frame,verified').in('id',window._conn).limit(50);if(q)qq=qq.or(`name.ilike.%${q}%,headline.ilike.%${q}%`);data=(await qq).data||[]}d.querySelector('#spl').innerHTML=(data||[]).map(p=>`<label style="display:flex;align-items:center;justify-content:flex-start;gap:12px;margin:8px 0;cursor:pointer;text-align:start"><input type="checkbox" value="${p.id}" ${picked.has(p.id)?'checked':''} style="width:20px;height:20px;flex:none;margin:0"><span class="av" style="flex:none">${avatar(p)}</span><span style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="muted">${esc(p.headline||'')}</div></span></label>`).join('')||`<p class="muted">${ar?'لا توجد اتصالات بعد. تابع أشخاصاً أولاً.':'No connections found. Follow people or get followers first.'}</p>`;d.querySelectorAll('#spl input').forEach(c=>c.onchange=()=>c.checked?picked.add(c.value):picked.delete(c.value))};let tm;d.querySelector('#spq').oninput=()=>{clearTimeout(tm);tm=setTimeout(load,250)};load();d.querySelector('#spext').onclick=()=>{d.remove();externalShare(id)};d.querySelector('#spsend').onclick=async()=>{if(!picked.size){d.querySelector('#spst').textContent=ar?'اختر شخصاً واحداً على الأقل.':'Pick at least one person.';return}const url=location.origin+location.pathname+'?post='+id,note=d.querySelector('#spn').value.trim(),body=(note?note+'\n':'')+url;let bad=null;for(const rid of picked){const r=await sb.from('messages').insert({sender_id:me.id,recipient_id:rid,body});if(r.error)bad=r.error.message}if(bad){d.querySelector('#spst').textContent=bad;return}d.remove();alert(ar?'تم إرسال المنشور.':'Post sent.')}}

function postOptionsDialog(id){const p=(window.feedPosts||[]).find(x=>x.id===id);if(!p||p.author_id!==me.id)return;const d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${lang==='ar'?'خيارات المنشور':'Post options'}</h2><button class="btn o" id="editpost">${lang==='ar'?'تعديل المنشور':'Edit post'}</button> <button class="btn o" id="deletepost">${t('Delete')}</button> <button class="btn o" onclick="this.closest('dialog').remove()">${t('Close')}</button>`;document.body.append(d);d.showModal();d.querySelector('#deletepost').onclick=()=>{d.remove();delPost(id)};d.querySelector('#editpost').onclick=()=>{d.innerHTML=`<h2>${lang==='ar'?'تعديل المنشور':'Edit post'}</h2><textarea id="editpostbody" rows="6" maxlength="10000">${esc(p.body)}</textarea><p class="help">${lang==='ar'?'ستبقى الصورة الحالية.':'Current photo will be kept.'}</p><p role="status"></p><button class="btn" id="savepost">${t('Save')}</button> <button class="btn o" onclick="this.closest('dialog').remove()">${t('Cancel')}</button>`;d.querySelector('#savepost').onclick=async()=>{const body=d.querySelector('textarea').value.trim();if(!body)return;const {error}=await sb.from('posts').update({body}).eq('id',id).eq('author_id',me.id);if(error){d.querySelector('[role=status]').textContent=error.message;return}d.remove();loadPosts()}}}
function post(job=null){window.editJob=job?.id||null;const ar=lang==='ar';$('app').innerHTML=`<div class="card"><h2>${job?(ar?'تعديل الوظيفة':'Edit job'):t('Post a job')}</h2><label>${t('Job title')}</label><input id="jt" maxlength="200" value="${esc(job?.title||'')}"><label>${t('Company')}</label><input id="jcompany" maxlength="200" value="${esc(job?.company_name||prof.name)}"><label>${t('Location')}</label><input id="jlo" value="${esc(job?.location||'')}"><label>${t('Type')}</label><select id="jy">${['Full-time','Part-time','Contract','Internship'].map(x=>`<option ${job?.job_type===x?'selected':''}>${x}</option>`).join('')}</select><label>${ar?'الراتب (اختياري)':'Salary range (optional)'}</label><div class="row" style="gap:6px;flex-wrap:wrap"><input id="jsmin" type="number" min="0" inputmode="numeric" placeholder="${ar?'من':'From'}" value="${job?.salary_min??''}" style="flex:1;min-width:90px"><input id="jsmax" type="number" min="0" inputmode="numeric" placeholder="${ar?'إلى':'To'}" value="${job?.salary_max??''}" style="flex:1;min-width:90px"></div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px"><select id="jscur" style="flex:1">${['EGP','USD','EUR','GBP','SAR','AED'].map(x=>`<option ${(job?.salary_currency||'EGP')===x?'selected':''}>${x}</option>`).join('')}</select><select id="jsper" style="flex:1"><option value="month" ${job?.salary_period!=='year'?'selected':''}>${ar?'شهرياً':'per month'}</option><option value="year" ${job?.salary_period==='year'?'selected':''}>${ar?'سنوياً':'per year'}</option></select></div><label>${t('Description')}</label><textarea id="jd" rows="5" maxlength="10000">${esc(job?.description||'')}</textarea><label>${ar?'طريقة التقديم: platform أو رابط https أو بريد إلكتروني':'Apply method: platform, https link or email'}</label><input id="jmethod" value="${esc(job?.apply_method||'platform')}"><p class="help">${ar?'platform يستقبل الطلبات داخل الموقع.':'platform receives applications on this site.'}</p><p id="jobmsg" role="status"></p><button class="btn" onclick="addJob()">${job?t('Save'):t('Publish')}</button></div>`}
async function addJob(){const title=$('jt').value.trim(),company_name=$('jcompany').value.trim(),description=$('jd').value.trim(),method=$('jmethod').value.trim()||'platform';if(!title||!company_name||!description){$('jobmsg').textContent=lang==='ar'?'أكمل العنوان والشركة والوصف.':'Fill title, company and description.';return}if(method!=='platform'&&!/^https:\/\/[^\s]+$/.test(method)&&!/^\S+@\S+\.\S+$/.test(method)){$('jobmsg').textContent='Use platform, an https URL or an email address.';return}const u={title,company_name,description,location:$('jlo').value.trim(),job_type:$('jy').value,apply_method:method,...salaryFields()};const {error}=window.editJob?await sb.from('jobs').update(u).eq('id',window.editJob).eq('company_id',me.id):await sb.from('jobs').insert({...u,company_id:me.id});if(error){$('jobmsg').textContent=error.message;return}go('jobs')}
async function loadJobs(){const q=($('q')?.value||'').toLowerCase();const {data:js,error}=await sb.from('jobs').select('*,profiles(name,kind,headline,avatar_path,photo_frame,verified)').order('created_at',{ascending:false});if(error){$('jl').textContent=error.message;return}window.loadedJobs=js||[];const {data:ap}=await sb.from('applications').select('job_id').eq('applicant_id',me.id);const applied=new Set((ap||[]).map(x=>x.job_id));$('jl').innerHTML=(js||[]).filter(j=>(!j.closed||j.company_id===me.id)&&(j.title+' '+(j.company_name||j.profiles.name)).toLowerCase().includes(q)&&salOk(j)).map(j=>`<div class="card"><div class="row" style="align-items:flex-start"><h3 style="flex:1;margin:0 0 8px">${esc(j.title)} ${j.closed?`<span class="tag">${lang==='ar'?'مغلقة':'Closed'}</span>`:''}</h3><button class="btn o" aria-label="Job options" onclick="jobMenu(${j.id})">⋯</button></div><p><a href="#" class="pl" onclick="openUser('${j.company_id}');return false">${esc(j.company_name||j.profiles.name)}</a> · ${esc(j.location)} · ${esc(j.job_type)}</p>${salaryText(j)?`<p><b>${salaryText(j)}</b></p>`:''}<div class="row"><span class="av ${j.profiles.kind==='company'?'companylogo':''}">${avatar(j.profiles)}</span><div><small class="muted">${lang==='ar'?'نشر بواسطة':'Posted by'}</small><div>${lk(j.company_id,j.profiles.name,j.profiles.verified)}</div></div></div><p style="white-space:pre-wrap">${esc(j.description)}</p>${j.company_id===me.id?`<button class="btn o" onclick="post(window.loadedJobs.find(x=>x.id===${j.id}))">${lang==='ar'?'تعديل':'Edit'}</button> <button class="btn o" onclick="toggleJob(${j.id},${!j.closed})">${j.closed?(lang==='ar'?'إعادة فتح':'Reopen'):(lang==='ar'?'إغلاق':'Close')}</button> <button class="btn" onclick="applicants(${j.id})">${lang==='ar'?'المتقدمون':'Applicants'}</button>`:!j.closed?(j.apply_method&&j.apply_method!=='platform'?`<a class="btn" href="${esc(j.apply_method.startsWith('https://')?j.apply_method:'mailto:'+j.apply_method)}" target="_blank" rel="noopener">${t('Apply')} ↗</a>`:`<button class="btn" ${applied.has(j.id)?'disabled':''} onclick="apply(${j.id})">${applied.has(j.id)?t('Applied ✓'):t('Apply')}</button>`):''}</div>`).join('')||`<div class="card muted">${t('No jobs yet.')}</div>`}
async function toggleJob(id,closed){const {error}=await sb.from('jobs').update({closed}).eq('id',id).eq('company_id',me.id);if(!socialError(error))loadJobs()}
async function apply(id){const {error}=await sb.from('applications').insert({job_id:id,applicant_id:me.id});if(!socialError(error))loadJobs()}
async function applicants(id){const {data,error}=await sb.from('applications').select('applicant_id,created_at,profiles(name,headline,verified)').eq('job_id',id).order('created_at',{ascending:false});$('app').innerHTML=`<button class="btn o" onclick="go('jobs')">${t('Back')}</button><div class="card"><h2>${lang==='ar'?'المتقدمون':'Applicants'}</h2>${error?esc(error.message):(data||[]).map(a=>`<p>${lk(a.applicant_id,a.profiles.name,a.profiles.verified)}<br>${esc(a.profiles.headline||'')}<br><button class="btn o" onclick="chatWith='${a.applicant_id}';go('msgs')">${t('Message')}</button></p>`).join('')||`<p>${t('None yet.')}</p>`}</div>`}

async function savePost(id,on){document.querySelectorAll('button[onclick^="savePost('+id+',"]').forEach(b=>{const ar=lang==='ar';b.textContent=on?('\u25C7 '+(ar?'\u062d\u0641\u0638':'Save')):('\u25C6 '+(ar?'\u062a\u0645 \u0627\u0644\u062d\u0641\u0638':'Saved'));b.setAttribute('onclick','savePost('+id+','+!on+')')});const {error}=on?await sb.from('bookmarks').delete().eq('post_id',id).eq('user_id',me.id):await sb.from('bookmarks').insert({post_id:id,user_id:me.id});if(socialError(error))loadPosts()}
async function repost(id,on){const d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${lang==='ar'?'إعادة نشر':'Repost'}</h2><p>${on?(lang==='ar'?'إلغاء إعادة النشر؟':'Remove your repost?'):(lang==='ar'?'إعادة نشر هذا المنشور لمتابعيك؟':'Repost this post to your followers?')}</p><button class="btn" id="confirmrepost">${lang==='ar'?'تأكيد':'Confirm'}</button> <button class="btn o" onclick="this.closest('dialog').remove()">${t('Cancel')}</button><p role="status"></p>`;document.body.append(d);d.showModal();d.querySelector('#confirmrepost').onclick=async()=>{const {error}=on?await sb.from('reposts').delete().eq('post_id',id).eq('user_id',me.id):await sb.from('reposts').insert({post_id:id,user_id:me.id});if(error){d.querySelector('[role=status]').textContent=error.message;return}d.remove();const U=['Undo repost','\u0625\u0644\u063a\u0627\u0621 \u0625\u0639\u0627\u062f\u0629 \u0627\u0644\u0646\u0634\u0631'],R=['Repost','\u0625\u0639\u0627\u062f\u0629 \u0646\u0634\u0631'];document.querySelectorAll('button[onclick^="repost('+id+',"]').forEach(b=>{let x=b.textContent;for(let k=0;k<2;k++){const [f,t2]=on?[U[k],R[k]]:[R[k],U[k]];if(x.includes(f)){x=x.replace(f,t2);break}}b.textContent=x;b.setAttribute('onclick','repost('+id+','+!on+')')})}}
async function externalShare(id){const url=location.origin+location.pathname+'?post='+id;try{if(navigator.share)await navigator.share({title:'Recrova Talent',url});else{await navigator.clipboard.writeText(url);alert(lang==='ar'?'تم نسخ رابط المنشور.':'Post link copied.')}}catch(e){if(e.name!=='AbortError')alert(e.message)}}
async function savedPosts(){window.onlySaved=true;page='feed';await feed()}

async function loadProfileReposts(id){const {data:rs,error}=await sb.from('reposts').select('post_id,created_at').eq('user_id',id).order('created_at',{ascending:false}).limit(50);if(error||!rs?.length)return;const [{data:actor},{data:ps},{data:mine}]=await Promise.all([sb.from('profiles').select('id,name,headline,avatar_path,photo_frame,verified').eq('id',id).single(),sb.from('posts').select('id,body,image_path,author_id,profiles!posts_author_id_fkey(name,headline,avatar_path,photo_frame,verified),likes(user_id)').in('id',rs.map(r=>r.post_id)),me?sb.from('reposts').select('post_id').eq('user_id',me.id):Promise.resolve({data:[]})]);if(!actor)return;const map=Object.fromEntries((ps||[]).map(p=>[p.id,p])),mySet=new Set((mine||[]).map(x=>x.post_id));const box=document.createElement('div');box.id='profile-reposts';box.className='card';box.innerHTML=`<h3>${lang==='ar'?'إعادة النشر':'Reposts'}</h3>`+rs.map(r=>{const p=map[r.post_id],on=p?.likes?.some(x=>x.user_id===me?.id);return p?`<article class="expitem"><div class="row"><span class="av">${avatar(actor)}</span><div><b>${lk(id,actor.name,actor.verified)}</b><div class="muted">${esc(actor.headline||'')}</div><small>${lang==='ar'?'أعاد النشر':'Reposted'}</small></div></div><div class="card" style="margin-top:12px"><div class="row"><span class="av">${avatar(p.profiles)}</span><div><b>${lk(p.author_id,p.profiles.name,p.profiles.verified)}</b><div class="muted">${esc(p.profiles.headline||'')}</div></div></div><p>${esc(p.body)}</p>${postImage(p.image_path)}${me?`<div class="row">${actionBar(p.id,p.likes?.length||0,on,(typeof saved!=='undefined'&&saved.has(p.id)),mySet.has(p.id))}</div><div id="comments-${p.id}"></div>`:`<a href="?post=${p.id}">${lang==='ar'?'فتح المنشور':'Open post'}</a>`}</div></article>`:''}).join('');if(page==='profile'||(page==='user'&&viewId===id)){$('profile-reposts')?.remove();const details=$('profile-details')||$('public-profile-details');if(details)details.before(box);else $('app').append(box)}}

async function verificationInfo(id){const d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>Verified account</h2><p id="verifybody">Loading...</p><button class="btn o" onclick="this.closest('dialog').remove()">${t('Close')}</button>`;document.body.append(d);d.showModal();const {data:p,error}=await sb.from('profiles').select('name,verified,verified_at').eq('id',id).maybeSingle();d.querySelector('#verifybody').innerHTML=error||!p?.verified?'Verification details are unavailable.':`<strong>${esc(p.name)}</strong><br><br>Verified by Recrova admin.<br>Badge date: ${p.verified_at?esc(p.verified_at):'Not recorded'}<br><br><span class="muted">This badge is managed by Recrova. It is not an identity check, background check or safety guarantee.</span>`}
function openRepost(id){history.replaceState(null,'','?post='+id);page='feed';render()}
function settingsRoot(){const u=new URL(location.href);u.searchParams.delete('section');history.replaceState(null,'',u);settings()}
function languageSettings(){const languages=[['en','English'],['ar','العربية (Arabic)'],['bn','Bangla'],['zh-Hans','Chinese (Simplified)'],['zh-Hant','Chinese (Traditional)'],['cs','Czech'],['da','Danish'],['nl','Dutch'],['fi','Finnish'],['fr','French'],['de','German'],['el','Greek'],['he','Hebrew'],['hi','Hindi'],['hu','Hungarian'],['id','Indonesian'],['it','Italian'],['ja','Japanese'],['ko','Korean'],['ms','Malay'],['mr','Marathi'],['no','Norwegian'],['fa','Persian'],['pl','Polish'],['pt','Portuguese'],['pa','Punjabi'],['ro','Romanian'],['ru','Russian'],['es','Spanish'],['sv','Swedish'],['tl','Tagalog'],['te','Telugu'],['th','Thai'],['tr','Turkish'],['uk','Ukrainian'],['vi','Vietnamese']];$('app').innerHTML=`<button class="btn o" onclick="settingsRoot()">${lang==='ar'?'رجوع إلى الإعدادات':'Back to Settings'}</button><div class="card"><h2>${lang==='ar'?'لغة العرض':'Display language'}</h2><label for="displaylanguage">${lang==='ar'?'اختر اللغة':'Choose a language'}</label><select id="displaylanguage">${languages.map(([v,n])=>`<option value="${v}" ${v===lang?'selected':''} ${!['en','ar'].includes(v)?'disabled':''}>${n}${!['en','ar'].includes(v)?' · Coming soon':''}</option>`).join('')}</select><p class="help">${lang==='ar'?'العربية والإنجليزية متاحتان حالياً. بقية اللغات في القائمة لم تُترجم بعد. محتوى الأعضاء يبقى بلغته الأصلية.':'Arabic and English are available now. Other listed languages are not translated yet. Member content stays in its original language.'}</p><button class="btn" onclick="lang=$('displaylanguage').value;localStorage.lang=lang;applyLang();setNav();languageSettings()">${t('Save')}</button></div>`}

setInterval(poll,20000);
init();applyLang();
</script></body></html>
