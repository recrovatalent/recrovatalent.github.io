*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f6f5fb;color:#1d2226}
header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{font-weight:800;color:#5B2DE8;font-size:20px}.logo span{color:#1d2226;font-weight:500}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:#555}

main{max-width:1100px;margin:16px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:260px 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e0dfdc;border-radius:10px;padding:16px;margin-bottom:12px}
.av{width:44px;height:44px;border-radius:50%;background:#5B2DE8;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.sq{border-radius:8px;background:#334155}
.row{display:flex;gap:12px;align-items:center}.muted{color:#666;font-size:13px}
.btn{background:#5B2DE8;color:#fff;border:0;border-radius:20px;padding:7px 16px;cursor:pointer;font-weight:600}.btn.o{background:#fff;color:#5B2DE8;border:1px solid #5B2DE8}
input,textarea,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit;margin:4px 0 10px}
.tag{background:#f1f5f9;border-radius:12px;padding:2px 10px;font-size:12px;margin-right:4px}
.page{display:none}.page.on{display:block}
.msgs{display:grid;grid-template-columns:260px 1fr;min-height:400px}.msgs .l{border-right:1px solid #eee}
.th{padding:10px;cursor:pointer;border-bottom:1px solid #f0f0f0}.th:hover{background:#f8fafc}
.b{max-width:70%;padding:8px 12px;border-radius:14px;margin:6px 0}.me{background:#5B2DE8;color:#fff;margin-left:auto}.th2{background:#eef2f1}
.note{background:#fef9c3;border:1px solid #fde047;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}

header{background:linear-gradient(90deg,#5B2DE8,#12104F);border:0}.logo{color:#fff}.logo span{color:#c9b2ff}
nav button{color:#e8dcff}nav button.on{background:#fff;color:#5B2DE8}
.hero{background:linear-gradient(135deg,#5B2DE8,#8B3BFF);color:#fff;border-radius:14px;padding:28px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0 0 14px;opacity:.9}.hero .btn{background:#fff;color:#5B2DE8}
.lang{background:#fff!important;color:#5B2DE8!important;border-radius:16px!important;font-weight:700}
.card{transition:box-shadow .15s}.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
[dir=rtl] nav{margin-left:0;margin-right:auto}[dir=rtl] .msgs .l{border-right:0;border-left:1px solid #eee}
[dir=rtl] .me{margin-left:0;margin-right:auto}[dir=rtl] .btn[style*="margin-left:auto"]{margin-left:0!important;margin-right:auto}

.auth{max-width:420px;margin:40px auto}.err{color:#b91c1c;font-size:13px;margin:6px 0}.ok{color:#047857;font-size:13px;margin:6px 0}
.pl{color:inherit;text-decoration:none;font-weight:700}.pl:hover{color:#5B2DE8;text-decoration:underline}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:#666}.tabs button.on{color:#5B2DE8;border-bottom:2px solid #5B2DE8}
header{background:linear-gradient(110deg,#0F0B4A,#21136a)}.bar{max-width:1180px;flex-wrap:wrap}.logo{white-space:nowrap;letter-spacing:-.4px}.logo span{font-weight:400}.btn:not(.o){background:linear-gradient(110deg,#5B2DE8,#8B3BFF)}.card{border-color:#e7e3f0;border-radius:14px}body{color:#12104F}a{color:#5B2DE8}.auth{margin-top:28px}.brandintro{text-align:center;margin:30px auto 0;max-width:580px}.brandintro h1{font-size:32px;line-height:1.2;margin:10px 0}.brandintro p{color:#6d658b}.tag{background:#eee8ff;color:#4e29bc}.msgs{overflow:hidden}@media(max-width:650px){.bar{gap:8px}.logo{font-size:17px}nav{order:3;width:100%;justify-content:center}nav button{padding:8px;font-size:12px}.msgs{grid-template-columns:110px 1fr}.row{flex-wrap:wrap}.brandintro h1{font-size:25px}}

function setNav(){let mb=$("topmessages");if(!mb){mb=document.createElement("button");mb.id="topmessages";mb.className="btn topmessages";mb.onclick=()=>go("msgs");$("morebtn").before(mb)}let ab=$("topalerts");if(!ab){ab=document.createElement("button");ab.id="topalerts";ab.className="btn topalerts";ab.onclick=()=>go("alerts");$("morebtn").before(ab)}ab.style.display=me?"":"none";ab.setAttribute("aria-label",t("Alerts"));ab.innerHTML=`<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/></svg>${unread?`<b>${unread}</b>`:""}`;mb.style.display=me?"":"none";mb.setAttribute("aria-label",t("Messages"));mb.innerHTML=`✉${window.messageUnread?`<b>${window.messageUnread}</b>`:""}`;document.body.classList.toggle("signed-in",!!me);$("morebtn").style.display=me?"":"none";$("moremenu").hidden=true;const n=$("nav");if(!me){n.style.display="none";$("out").style.display="none";return}n.style.display="flex";$("out").style.display="";
const items=[["feed","Feed"],["jobs","Jobs"],["network","Network"],["profile","My Profile"]];items.splice(2,0,["post","Post a Job"]);$("out").textContent=t("Log out");
n.innerHTML=items.map(i=>`<button data-p="${i[0]}" class="${page==i[0]?"on":""}" onclick="go('${i[0]}')">${navIcon(i[0])}<span>${t(i[1])}</span>${i[0]=="alerts"&&unread?` <b style="background:#dc2626;color:#fff;border-radius:10px;padding:0 6px;font-size:11px">${unread}</b>`:""}</button>`).join("")}
function menuSVG(p){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`}function toggleMore(){const m=$("moremenu");m.hidden=!m.hidden;m.innerHTML=`<div class="menutitle">${esc(prof?.name||'Recrova')}</div><button onclick="go('profile')">${navIcon('profile')}<span>${t('My Profile')}</span><span class="chevron">›</span></button><button onclick="go('settings')">${menuSVG('<path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="5"/>')}<span>${t('Settings')}</span><span class="chevron">›</span></button><button onclick="savedPosts();$('moremenu').hidden=true">${menuSVG('<path d="M6 3h12v18l-6-4-6 4z"/>')}<span>${lang==='ar'?'المحفوظات':'Saved posts'}</span></button><button class="logoutitem" onclick="logout()">${menuSVG('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>')}<span>${t('Log out')}</span></button>`}
function go(p){window.onlySaved=false;page=p;if(p!="user"){viewId=null;history.replaceState(null,"",location.pathname)}render()}
async function logout(){$("moremenu").hidden=true;await sb.auth.signOut();me=null;prof=null;render()}
function render(){if(recovering)return recoveryView();setNav();if(!me){if(viewId)return user();return authView()}({feed,jobs,network,msgs,profile,post,alerts,user,settings}[page]||feed)()}

let loginBusy=false;
async function doAuth(){if(loginBusy)return;loginBusy=true;try{await runAuth()}finally{loginBusy=false}}
async function runAuth(){const email=$("em").value.trim().toLowerCase(),password=$("pw").value;const m=$("msg");m.className="err";m.textContent="";
if(mode=="signup"){const {data,error}=await sb.auth.signUp({email,password,options:{data:{kind:$("kind").value,name:$("nm").value.trim()},emailRedirectTo:location.origin+location.pathname}});if(error){m.textContent=error.message;return}
if(!data.session){m.className="ok";m.textContent=t("Account created. Check your email to confirm it, then log in.");return}await loadMe(data.user);page="feed";render()}
else{m.textContent=lang=="ar"?"جارٍ تسجيل الدخول...":"Signing in...";const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){m.textContent=(error.code?"["+error.code+"] ":"")+error.message;return}await loadMe(data.user);page="feed";render()}}
async function forgot(){const email=$("em").value.trim().toLowerCase();const m=$("msg");if(!email){m.className="err";m.textContent=t("Enter your email first.");return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});m.className=error?"err":"ok";m.textContent=error?error.message:t("Password reset email sent.")}

muted">${t("No posts yet. Be the first.")}</div>`}

async function putFile(file,bucket,prefix){const image=bucket==='recrova-images',allowed=image?['image/jpeg','image/png','image/webp']:['application/pdf'];if(!allowed.includes(file.type))throw Error(image?'JPG, PNG or WebP only.':'PDF only.');if(file.size>(image?3:5)*1024*1024)throw Error(image?'Maximum 3 MB.':'Maximum 5 MB.');const ext=image?({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type]):'pdf',path=me.id+'/'+prefix+'-'+crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from(bucket).upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return path}

async function addExperience(){const role=$('er').value.trim(),company=$('ec').value.trim();if(!role||!company){$('exmsg').textContent=lang==='ar'?'اكتب المسمى والشركة.':'Enter role and company.';return}if((prof.experience||[]).length>=30)return;await saveExperience([...(prof.experience||[]),{role,company,period:$('ep').value.trim(),description:$('ed').value.trim()}])}

function profileOptions(){const ar=lang==='ar',d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${ar?'خيارات الملف':'Profile options'}</h2><div class="settingslist"><button data-action="edit">${t('Edit profile')}</button><button data-action="experience">${t('Experience')}</button><button data-action="details">${ar?'التعليم والمهارات':'Education & skills'}</button><button data-action="photo">${ar?'الصورة والإطار':'Photo & frame'}</button></div><p><button class="btn o" id="pclose">${ar?'إغلاق':'Close'}</button></p>`;document.body.appendChild(d);const close=()=>{d.close();d.remove()};d.querySelector('#pclose').onclick=close;d.oncancel=e=>{e.preventDefault();close()};d.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;close();if(a==='edit')profile(true);if(a==='photo')photoOptions();if(a==='details')profileDetailsEditor();if(a==='experience'){$('app').innerHTML=`<button class="btn o" onclick="profile()">${ar?'رجوع إلى الملف':'Back to profile'}</button>`+experienceEditor()}});d.showModal()}
function profileSections(p){const ar=lang==='ar';return `<div class="card profiledata"><b>${ar?'نبذة':'About'}</b><p>${esc(p.about||'')}</p><div>${esc(p.headline||'')}</div><div class="muted">${esc(p.location||'')}</div></div>${experienceView(p.experience)}<div class="card"><b>${ar?'التعليم':'Education'}</b>${(p.education||[]).map(x=>`<div class="expitem"><h4>${esc(x.school)}</h4><div>${esc(x.degree||'')}</div><div class="muted">${esc(x.period||'')}</div></div>`).join('')||`<p class="muted">${ar?'لم يُضف تعليم بعد.':'No education added yet.'}</p>`}</div><div class="card"><b>${ar?'المهارات':'Skills'}</b><p>${(p.skills||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')||`<span class="muted">${ar?'لم تُضف مهارات بعد.':'No skills added yet.'}</span>`}</p></div>`}
function profileDetailsEditor(){const ar=lang==='ar';$('app').innerHTML=`<button class="btn o" onclick="profile()">${ar?'رجوع إلى الملف':'Back to profile'}</button><div class="card"><h2>${ar?'التعليم':'Education'}</h2>${(prof.education||[]).map((x,i)=>`<p>${esc(x.school)} · ${esc(x.degree||'')} <button class="btn o" onclick="removeEducation(${i})">${t('Remove')}</button></p>`).join('')}<label>${ar?'الجامعة أو المؤسسة التعليمية':'University / school'}</label><input id="edschool" maxlength="160"><label>${ar?'الدرجة أو مجال الدراسة':'Degree / field'}</label><input id="eddegree" maxlength="160"><label>${t('Period')}</label><input id="edperiod" maxlength="80"><button class="btn" onclick="addEducation()">${ar?'إضافة تعليم':'Add education'}</button></div><div class="card"><h2>${ar?'المهارات':'Skills'}</h2><label>${ar?'مهارة في كل سطر':'One skill per line'}</label><textarea id="skillrows" rows="5" maxlength="3000">${esc((prof.skills||[]).join('\n'))}</textarea><button class="btn" onclick="saveSkills()">${t('Save')}</button></div><div id="detailmsg" role="status"></div>`}
async function saveDetails(u){const {error}=await sb.from('profiles').update(u).eq('id',me.id);if(error){$('detailmsg').textContent=error.message;return}Object.assign(prof,u);profileDetailsEditor()}
async function addEducation(){const school=$('edschool').value.trim();if(!school)return;if((prof.education||[]).length>=30)return;saveDetails({education:[...(prof.education||[]),{school,degree:$('eddegree').value.trim(),period:$('edperiod').value.trim()}]})}
async function removeEducation(i){saveDetails({education:(prof.education||[]).filter((x,n)=>i!==n)})}
async function saveSkills(){saveDetails({skills:[...new Set($('skillrows').value.split('\n').map(x=>x.trim().slice(0,100)).filter(Boolean))].slice(0,50)})}
async function loadOwnPosts(){const {data,error}=await sb.from('posts').select('id,body,image_path,created_at').eq('author_id',me.id).order('created_at',{ascending:false}).limit(50);const d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${t('Posts')}</h3>${error?`<p>${esc(error.message)}</p>`:(data||[]).map(p=>`<div class="expitem"><div class="muted">${new Date(p.created_at).toLocaleString()}</div><p>${esc(p.body)}</p>${postImage(p.image_path)}</div>`).join('')||`<p class="muted">${t('No posts yet.')}</p>`}`;if(page==='profile'||viewId===me.id){$('app').append(d);loadProfileReposts(me.id)}}

let myCV=null;
function cvEditor(){return `<div class="card"><b>${t('CV / Resume')}</b><div class="help">${t('Private. Only you can open this file. PDF, up to 5 MB.')}</div><div id="cvstate" class="help"></div><input id="cvfile" type="file" accept="application/pdf"><button class="btn" onclick="uploadCV()">${t('Upload CV')}</button> <button class="btn o" onclick="openCV()">${t('Open my CV')}</button> <button class="btn o" onclick="removeCV()">${t('Remove CV')}</button><div id="cvmsg" class="help" role="status"></div></div>`}
async function loadCV(){const {data,error}=await sb.from('resumes').select('path,filename').eq('user_id',me.id).maybeSingle();myCV=data;if($('cvstate'))$('cvstate').textContent=error?error.message:(data?.filename||t('No CV uploaded.'))}
async function uploadCV(){const f=$('cvfile').files[0];if(!f){$('cvmsg').textContent=t('Choose a file first.');return}let path;try{$('cvmsg').textContent=t('Uploading...');path=await putFile(f,'recrova-cvs','cv');const {error}=await sb.from('resumes').upsert({user_id:me.id,path,filename:f.name,updated_at:new Date().toISOString()});if(error)throw error;if(myCV?.path)await sb.storage.from('recrova-cvs').remove([myCV.path]);await loadCV();$('cvmsg').textContent=t('Saved.')}catch(e){if(path)await sb.storage.from('recrova-cvs').remove([path]);$('cvmsg').textContent=e.message}}
async function openCV(){if(!myCV){$('cvmsg').textContent=t('No CV uploaded.');return}const {data,error}=await sb.storage.from('recrova-cvs').createSignedUrl(myCV.path,60);if(error){$('cvmsg').textContent=error.message;return}$('cvmsg').innerHTML=`<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener">${t('Open my CV')} ↗</a>`}
async function removeCV(){if(!myCV)return;const {error}=await sb.storage.from('recrova-cvs').remove([myCV.path]);if(error){$('cvmsg').textContent=error.message;return}const r=await sb.from('resumes').delete().eq('user_id',me.id);if(r.error){$('cvmsg').textContent=r.error.message;return}myCV=null;loadCV()}

function settingsBody(){ $('app').innerHTML=`<div class="card"><h2>${t('Settings')}</h2><p class="muted">${esc(me.email)}</p><label>${lang==='ar'?'اللغة':'Language'}</label><button class="btn o" onclick="toggleLang()">${lang==='ar'?'English':'العربية'}</button></div><div class="card"><h3>${t('Change password')}</h3><label>${t('Current password')}</label><input id="scurrent" type="password" autocomplete="current-password"><label>${t('New password')}</label><input id="snew" type="password" autocomplete="new-password" minlength="8"><label>${t('Confirm password')}</label><input id="sconfirm" type="password" autocomplete="new-password"><button class="btn" onclick="changePassword()">${t('Change password')}</button><div id="spmsg" class="help" role="status"></div></div><div class="card"><h3>${t('Change email')}</h3><p class="help">${lang==='ar'?'ستحتاج إلى تأكيد التغيير عبر البريد. لن يتغير بريدك حتى إتمام التأكيد.':'Confirm the change by email. Your address is not changed until confirmation is complete.'}</p><label>${t('Current password')}</label><input id="sepass" type="password" autocomplete="current-password"><label>${t('New email')}</label><input id="semail" type="email" autocomplete="email"><button class="btn" onclick="changeEmail()">${t('Send confirmation')}</button><div id="semsg" class="help" role="status"></div></div><div class="card" style="border-color:#e8b2be"><h3 style="color:#a52144">${t('Close account')}</h3><p>${lang==='ar'?'حذف نهائي لحسابك وملفك ومنشوراتك ووظائفك وطلباتك ومتابعاتك ورسائلك وملفاتك المرفوعة. لا يمكن التراجع. حمّل نسخة من ملفاتك أولاً.':'Permanently delete your account, profile, posts, jobs, applications, follows, messages and uploaded files. This cannot be undone. Download anything you need first.'}</p><label>${t('Current password')}</label><input id="sdpass" type="password" autocomplete="current-password"><label>${lang==='ar'?'اكتب DELETE للتأكيد':'Type DELETE to confirm'}</label><input id="sdconfirm" autocomplete="off"><button class="btn" style="background:#a52144" onclick="closeAccount()">${t('Permanently delete my account')}</button><div id="sdmsg" class="help" role="status"></div></div><div class="card"><button class="btn o" onclick="logout()">${t('Log out')}</button></div>`}
async function verifyPassword(id){const p=$(id).value;if(!p)throw Error(lang==='ar'?'اكتب كلمة المرور الحالية.':'Enter your current password.');const {error}=await sb.auth.signInWithPassword({email:me.email,password:p});if(error)throw error;$(id).value=''}
async function changePassword(){const m=$('spmsg');try{const password=$('snew').value;if(password.length<8||password!==$('sconfirm').value)throw Error(lang==='ar'?'كلمة المرور ٨ أحرف على الأقل ويجب تطابق التأكيد.':'Use at least 8 characters and matching passwords.');await verifyPassword('scurrent');const {error}=await sb.auth.updateUser({password});if(error)throw error;$('snew').value='';$('sconfirm').value='';m.textContent=t('Saved.')}catch(e){m.textContent=e.message}}
async function changeEmail(){const m=$('semsg');try{const email=$('semail').value.trim();if(!$('semail').checkValidity()||!email||email===me.email)throw Error(lang==='ar'?'اكتب بريداً جديداً صحيحاً.':'Enter a valid new email address.');await verifyPassword('sepass');const {error}=await sb.auth.updateUser({email},{emailRedirectTo:location.origin+location.pathname});if(error)throw error;m.textContent=lang==='ar'?'افتح البريد القديم والجديد وأكّد التغيير.':'Check your old and new inboxes and confirm the change.'}catch(e){m.textContent=e.message}}
async function closeAccount(){const m=$('sdmsg');if($('sdconfirm').value!=='DELETE'){m.textContent=lang==='ar'?'اكتب DELETE للتأكيد.':'Type DELETE to confirm.';return}if(!confirm(lang==='ar'?'هل تريد حذف حسابك وبياناته نهائياً؟':'Permanently delete your account and its data?'))return;try{await verifyPassword('sdpass');m.textContent=lang==='ar'?'جارٍ حذف الملفات والحساب...':'Deleting files and account...';for(const bucket of ['recrova-images','recrova-cvs']){for(;;){const {data,error}=await sb.storage.from(bucket).list(me.id,{limit:100});if(error)throw error;if(!data?.length)break;const r=await sb.storage.from(bucket).remove(data.map(x=>me.id+'/'+x.name));if(r.error)throw r.error}}const {error}=await sb.rpc('close_my_account');if(error)throw error;await sb.auth.signOut();me=null;prof=null;viewId=null;page='feed';history.replaceState(null,'',location.pathname);render()}catch(e){m.textContent=e.message}}

function recoveryView(){document.body.classList.remove('signed-in');$('nav').style.display='none';$('out').style.display='none';$('app').innerHTML=`<div class="card auth"><h2>${lang==='ar'?'عيّن كلمة مرور جديدة':'Set a new password'}</h2><label>${t('New password')}</label><input id="rpw" type="password" autocomplete="new-password"><label>${t('Confirm password')}</label><input id="rpw2" type="password" autocomplete="new-password"><button class="btn" onclick="saveRecovery()">${t('Save')}</button><div id="rmsg" class="help" role="status"></div></div>`}
async function saveRecovery(){const password=$('rpw').value;if(password.length<8||password!==$('rpw2').value){$('rmsg').textContent=lang==='ar'?'كلمة المرور ٨ أحرف على الأقل ويجب تطابق التأكيد.':'Use at least 8 characters and matching passwords.';return}const {error}=await sb.auth.updateUser({password});if(error){$('rmsg').textContent=error.message;return}recovering=false;await sb.auth.signOut();me=null;prof=null;history.replaceState(null,'',location.pathname);render();$('msg').className='ok';$('msg').textContent=lang==='ar'?'تم تغيير كلمة المرور. سجل الدخول بالجديدة.':'Password changed. Log in with your new password.'}
function photoOptions(){const ar=lang==='ar',d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${ar?'صورة الملف الشخصي':'Profile photo'}</h2><div class="settingslist"><button id="photochange">${ar?'رفع أو تغيير الصورة':'Upload / change photo'}</button>${prof.avatar_path?`<button id="photoremove">${ar?'حذف الصورة':'Remove photo'}</button>`:''}</div><h3>${ar?'إطار الصورة':'Photo frame'}</h3><p class="help">${ar?'يظهر على ملفك ومنشوراتك ونتائج البحث.':'Shown on your profile, posts and search results.'}</p><label for="photoframe">${ar?'اختر الإطار':'Choose frame'}</label><select id="photoframe"><option value="none">${ar?'بدون إطار':'No frame'}</option><option value="open">Open to work</option><option value="hiring">Hiring</option></select><div id="framepreview" class="av" style="width:100px;height:100px;margin:10px auto;font-size:30px"></div><div id="framemsg" class="help" role="status"></div><div class="cropactions"><button class="btn o" id="photocancel">${ar?'إلغاء':'Cancel'}</button><button class="btn" id="photosave">${ar?'حفظ الإطار':'Save frame'}</button></div>`;document.body.appendChild(d);const f=d.querySelector('select');f.value=prof.photo_frame||'none';const preview=()=>d.querySelector('#framepreview').innerHTML=avatar({...prof,photo_frame:f.value});f.onchange=preview;preview();const close=()=>{d.close();d.remove()};d.oncancel=e=>{e.preventDefault();close()};d.querySelector('#photocancel').onclick=close;d.querySelector('#photochange').onclick=()=>{close();$('avatarfile').click()};if(prof.avatar_path)d.querySelector('#photoremove').onclick=()=>{close();removeAvatar()};d.querySelector('#photosave').onclick=async()=>{const b=d.querySelector('#photosave');b.disabled=true;const {error}=await sb.from('profiles').update({photo_frame:f.value}).eq('id',me.id);if(error){d.querySelector('#framemsg').textContent=error.message;b.disabled=false;return}prof.photo_frame=f.value;close();profile()};d.showModal()}

function cropImage(file){return new Promise((resolve,reject)=>{if(!['image/jpeg','image/png','image/webp'].includes(file.type)){reject(Error('JPG, PNG or WebP only.'));return}if(file.size>3*1024*1024){reject(Error('Maximum 3 MB.'));return}let url,img;const ready=()=>{const ar=lang==='ar',d=document.createElement('dialog');d.className='cropdialog';d.setAttribute('aria-labelledby','croptitle');d.innerHTML=`<h2 id="croptitle">${ar?'ضبط صورة الملف الشخصي':'Adjust profile photo'}</h2><p class="help">${ar?'اسحب الصورة لتحريكها. استخدم التكبير لضبط الإطار.':'Drag to reposition. Use zoom to adjust the frame.'}</p><canvas id="cropcanvas" width="600" height="600" aria-label="${ar?'معاينة قص الصورة':'Photo crop preview'}"></canvas><label for="cropzoom">${ar?'التكبير':'Zoom'}</label><input id="cropzoom" type="range" min="1" max="3" step="0.01" value="1"><div class="cropactions"><button class="btn o" id="cropcancel">${ar?'إلغاء':'Cancel'}</button><button class="btn" id="cropuse">${ar?'استخدام الصورة':'Use photo'}</button></div>`;document.body.appendChild(d);const c=d.querySelector('canvas'),ctx=c.getContext('2d'),z=d.querySelector('#cropzoom');let zoom=1,x=0,y=0,drag=null;const base=Math.max(600/(img.naturalWidth||img.width),600/(img.naturalHeight||img.height));function draw(){const w=(img.naturalWidth||img.width)*base*zoom,h=(img.naturalHeight||img.height)*base*zoom;x=Math.min((w-600)/2,Math.max(-(w-600)/2,x));y=Math.min((h-600)/2,Math.max(-(h-600)/2,y));ctx.fillStyle='#fff';ctx.fillRect(0,0,600,600);ctx.drawImage(img,(600-w)/2+x,(600-h)/2+y,w,h);ctx.save();ctx.fillStyle='#11103c65';ctx.beginPath();ctx.rect(0,0,600,600);ctx.arc(300,300,298,0,Math.PI*2,true);ctx.fill('evenodd');ctx.restore()}function finish(v){if(url)URL.revokeObjectURL(url);d.close();d.remove();resolve(v)}z.oninput=()=>{zoom=Number(z.value);draw()};c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:x,oy:y};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;const scale=600/c.getBoundingClientRect().width;x=drag.ox+(e.clientX-drag.x)*scale;y=drag.oy+(e.clientY-drag.y)*scale;draw()};c.onpointerup=c.onpointercancel=()=>{drag=null};d.querySelector('#cropcancel').onclick=()=>finish(null);d.oncancel=e=>{e.preventDefault();finish(null)};d.querySelector('#cropuse').onclick=()=>{const out=document.createElement('canvas');out.width=out.height=600;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,600,600);const w=(img.naturalWidth||img.width)*base*zoom,h=(img.naturalHeight||img.height)*base*zoom;o.drawImage(img,(600-w)/2+x,(600-h)/2+y,w,h);out.toBlob(b=>{if(!b){reject(Error('Could not process photo.'));d.close();d.remove();if(url)URL.revokeObjectURL(url);return}finish(new File([b],'profile-crop.jpg',{type:'image/jpeg'}))},'image/jpeg',0.9)};d.showModal();draw()};createImageBitmap(file).then(b=>{img=b;ready()}).catch(()=>{const reader=new FileReader();img=new Image();img.onload=ready;img.onerror=()=>reject(Error('Could not read this image.'));reader.onerror=()=>reject(Error('Could not read this image.'));reader.onload=()=>{img.src=reader.result};reader.readAsDataURL(file)})})}

function settings(section){const ar=lang==='ar';if(section===undefined){const labels=ar?['اللغة','تغيير كلمة المرور','تغيير البريد الإلكتروني','إغلاق الحساب']:['Language','Change password','Change email','Close account'];$('app').innerHTML=`<div class="card"><h2>${t('Settings')}</h2><p class="muted">${esc(me.email)}</p><div class="settingslist">${labels.map((x,i)=>`<button onclick="settings(${i})">${x} <span style="float:inline-end">›</span></button>`).join('')}<button onclick="settings(4)">${ar?'الخصوصية والسيرة الذاتية':'Privacy & private CV'} <span style="float:inline-end">›</span></button></div></div>`;return}if(section===4){$('app').innerHTML=cvEditor();loadCV()}else{settingsBody();const cards=Array.from($('app').children);cards.forEach((c,i)=>{if(i!==section)c.remove()})}const b=document.createElement('button');b.className='btn o settingsback';b.textContent=ar?'رجوع إلى الإعدادات':'Back to Settings';b.onclick=()=>settings();$('app').prepend(b);window.scrollTo(0,0)}
const navIcon=k=>{const paths={feed:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',jobs:'<rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12c5 4 13 4 18 0M12 12v4"/>',network:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-4-5"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',post:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 7v10M7 12h10"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[k]||paths.feed}</svg>`};
function countLinks(id,a,b){return `<button class="countlink" onclick="followList('${id}','followers')"><b>${a||0}</b> ${t('followers')}</button><button class="countlink" onclick="followList('${id}','following')"><b>${b||0}</b> ${lang==='ar'?'يتابع':'following'}</button>`}
async function followList(id,kind){const d=document.createElement('dialog');d.className='cropdialog followdialog';d.innerHTML=`<h2>${kind==='followers'?t('followers'):(lang==='ar'?'يتابع':'Following')}</h2><div class="followpeople">...</div><button class="btn o" onclick="this.closest('dialog').remove()">${t('Close')}</button>`;document.body.append(d);d.showModal();await fillFollowList(d,id,kind)}
async function fillFollowList(d,id,kind){const col=kind==='followers'?'follower_id':'followee_id',filter=kind==='followers'?'followee_id':'follower_id';const {data:rows,error}=await sb.from('follows').select(col).eq(filter,id);const box=d.querySelector('.followpeople');if(error){box.textContent=error.message;return}const ids=(rows||[]).map(x=>x[col]);if(!ids.length){box.textContent=lang==='ar'?'لا يوجد بعد.':'None yet.';return}const [{data:ps},{data:fs},{data:backs}]=await Promise.all([sb.from('profiles').select('id,name,headline,avatar_path,photo_frame,verified').in('id',ids),sb.from('follows').select('followee_id').eq('follower_id',me.id),sb.from('follows').select('follower_id').eq('followee_id',me.id)]);const mine=new Set((fs||[]).map(x=>x.followee_id)),back=new Set((backs||[]).map(x=>x.follower_id));box.innerHTML=(ps||[]).map(p=>`<div class="followrow"><a class="av" href="#" onclick="this.closest('dialog').remove();openUser('${p.id}');return false">${avatar(p)}</a><div class="followname"><a class="pl" href="#" onclick="this.closest('dialog').remove();openUser('${p.id}');return false">${esc(p.name)}${badge(p.verified)}</a><div class="muted">${esc(p.headline||'')}</div></div>${p.id!==me.id?`<button class="btn o" data-follow="${p.id}" data-on="${mine.has(p.id)}">${mine.has(p.id)?(lang==='ar'?'إلغاء المتابعة':'Unfollow'):back.has(p.id)?(lang==='ar'?'متابعة بالمثل':'Follow back'):t('Follow')}</button>`:''}</div>`).join('');box.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{b.disabled=true;const pid=b.dataset.follow,on=b.dataset.on==='true';const {error}=on?await sb.from('follows').delete().eq('follower_id',me.id).eq('followee_id',pid):await sb.from('follows').insert({follower_id:me.id,followee_id:pid});if(error){b.disabled=false;alert(error.message);return}await fillFollowList(d,id,kind)})}

async function alerts(){const {data:ns,error}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(50);if(error){$('app').textContent=error.message;return}const ids=[...new Set((ns||[]).map(n=>n.actor_id).filter(Boolean))];const {data:ps}=ids.length?await sb.from('profiles').select('id,name,avatar_path,photo_frame,verified').in('id',ids):{data:[]};const actors=Object.fromEntries((ps||[]).map(p=>[p.id,p]));const {data:myf}=await sb.from('follows').select('followee_id').eq('follower_id',me.id);const myfollowing=new Set((myf||[]).map(f=>f.followee_id));window.alertRows=ns||[];$('app').innerHTML=`<div class="card row"><h2>${t('Alerts')}</h2><button class="btn o" style="margin-inline-start:auto" onclick="readAll()">${t('Mark all read')}</button></div>`+((ns||[]).map(n=>{const a=actors[n.actor_id],click=n.actor_id||n.post_id;return `<div role="${click?'button':'group'}" tabindex="${click?'0':'-1'}" class="card alertrow ${n.read?'':'newalert'}" ${click?`onclick="openAlert(${n.id})"`:''}>${a?`<span class="av">${avatar(a)}</span>`:'<span class="alertsymbol">♧</span>'}<span class="alertcopy">${a?`<strong>${esc(a.name)}${badge(a.verified)}</strong><br>`:''}<span>${esc(n.title)}</span>${n.body?`<span class="muted alertbody">${esc(n.body)}</span>`:''}<small>${new Date(n.created_at).toLocaleString()}</small>${n.kind==='follow'&&a&&a.id!==me.id&&!myfollowing.has(a.id)?`<button class="btn o" onclick="event.stopPropagation();alertFollow('${a.id}',this)">${lang==='ar'?'متابعة بالمثل':'Follow back'}</button>`:''}</span></div>`}).join('')||`<div class="card muted">${t('No notifications yet.')}</div>`)}
async function alertFollow(id,b){b.disabled=true;const {error}=await sb.from('follows').insert({follower_id:me.id,followee_id:id});if(error){b.disabled=false;alert(error.message);return}alerts()}
async function openAlert(id){const n=(window.alertRows||[]).find(x=>x.id===id);if(!n)return;await sb.from('notifications').update({read:true}).eq('id',id).eq('user_id',me.id);if(n.post_id){page='feed';viewId=null;history.replaceState(null,'',location.pathname+'?post='+n.post_id);render()}else if(n.actor_id)openUser(n.actor_id);poll()}

function socialLabels(){return lang==='ar'?{comment:'تعليق',share:'مشاركة',likes:'الإعجابات',write:'اكتب تعليقاً...',empty:'لا توجد تعليقات بعد.',send:'نشر'}:{comment:'Comment',share:'Share',likes:'Likes',write:'Write a comment...',empty:'No comments yet.',send:'Post'}}
function socialError(e){if(e)alert(e.message);return !!e}
async function comments(id){const l=socialLabels(),box=$('comments-'+id);if(!box)return;const {data,error}=await sb.from('comments').select('id,user_id,body,created_at,profiles!comments_user_id_fkey(name,verified),comment_likes(user_id)').eq('post_id',id).order('created_at');if(error){box.textContent=error.message;return}box.innerHTML=(data||[]).map(c=>`<div class="expitem"><b>${lk(c.user_id,c.profiles.name,c.profiles.verified)}</b><p>${esc(c.body)}</p><button class="btn o" onclick="commentLike(${c.id},${id},${c.comment_likes.some(x=>x.user_id===me.id)})">👍</button> <button class="btn o" onclick="whoLiked('comment',${c.id})">${c.comment_likes.length} ${l.likes}</button> ${c.user_id===me.id?`<button class="btn o" onclick="deleteComment(${c.id},${id})">${t('Delete')}</button>`:''}</div>`).join('')||`<p class="muted">${l.empty}</p>`;box.innerHTML+=`<textarea id="commentbody-${id}" rows="2" maxlength="3000" placeholder="${l.write}"></textarea><button class="btn" onclick="addComment(${id})">${l.send}</button>`}
async function addComment(id){const body=$('commentbody-'+id).value.trim();if(!body)return;const {error}=await sb.from('comments').insert({post_id:id,user_id:me.id,body});if(!socialError(error))comments(id)}
async function deleteComment(cid,pid){const {error}=await sb.from('comments').delete().eq('id',cid);if(!socialError(error))comments(pid)}
async function commentLike(cid,pid,on){const {error}=on?await sb.from('comment_likes').delete().eq('comment_id',cid).eq('user_id',me.id):await sb.from('comment_likes').insert({comment_id:cid,user_id:me.id});if(!socialError(error))comments(pid)}
async function whoLiked(kind,id){const d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${socialLabels().likes}</h2><div class="likelist">...</div><button class="btn o" onclick="this.closest('dialog').remove()">${t('Close')}</button>`;document.body.append(d);d.showModal();const {data,error}=await sb.from(kind==='comment'?'comment_likes':'likes').select('user_id').eq(kind==='comment'?'comment_id':'post_id',id);if(error){d.querySelector('.likelist').textContent=error.message;return}const ids=(data||[]).map(x=>x.user_id);if(!ids.length){d.querySelector('.likelist').textContent=lang==='ar'?'لا توجد إعجابات بعد.':'No likes yet.';return}const {data:ps}=await sb.from('profiles').select('id,name,verified').in('id',ids);d.querySelector('.likelist').innerHTML=(ps||[]).map(p=>`<p><a href="#" onclick="this.closest('dialog').remove();openUser('${p.id}');return false">${esc(p.name)}${badge(p.verified)}</a></p>`).join('')}
async function sharePost(id){const url=location.origin+location.pathname+'?post='+id;const d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${socialLabels().share}</h2><p>${lang==='ar'?'رابط المنشور':'Post link'}</p><input readonly value="${esc(url)}"><button class="btn" id="confirmshare">${lang==='ar'?'تسجيل المشاركة ونسخ الرابط':'Share & copy link'}</button> <button class="btn o" onclick="this.closest('dialog').remove()">${t('Cancel')}</button><p role="status"></p>`;document.body.append(d);d.showModal();d.querySelector('#confirmshare').onclick=async()=>{const {error}=await sb.from('shares').upsert({post_id:id,user_id:me.id},{onConflict:'post_id,user_id',ignoreDuplicates:true});if(error){d.querySelector('[role=status]').textContent=error.message;return}try{await navigator.clipboard.writeText(url);d.querySelector('[role=status]').textContent=lang==='ar'?'تم نسخ الرابط.':'Link copied.'}catch{d.querySelector('[role=status]').textContent=lang==='ar'?'انسخ الرابط من الخانة.':'Copy the link above.'}d.querySelector('#confirmshare').disabled=true}}

function postOptions(id){const p=(window.feedPosts||[]).find(x=>x.id===id);if(!p||p.author_id!==me.id)return;const d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${lang==='ar'?'خيارات المنشور':'Post options'}</h2><button class="btn o" id="editpost">${lang==='ar'?'تعديل المنشور':'Edit post'}</button> <button class="btn o" id="deletepost">${t('Delete')}</button> <button class="btn o" onclick="this.closest('dialog').remove()">${t('Close')}</button>`;document.body.append(d);d.showModal();d.querySelector('#deletepost').onclick=()=>{d.remove();delPost(id)};d.querySelector('#editpost').onclick=()=>{d.innerHTML=`<h2>${lang==='ar'?'تعديل المنشور':'Edit post'}</h2><textarea id="editpostbody" rows="6" maxlength="10000">${esc(p.body)}</textarea><p class="help">${lang==='ar'?'ستبقى الصورة الحالية.':'Current photo will be kept.'}</p><p role="status"></p><button class="btn" id="savepost">${t('Save')}</button> <button class="btn o" onclick="this.closest('dialog').remove()">${t('Cancel')}</button>`;d.querySelector('#savepost').onclick=async()=>{const body=d.querySelector('textarea').value.trim();if(!body)return;const {error}=await sb.from('posts').update({body}).eq('id',id).eq('author_id',me.id);if(error){d.querySelector('[role=status]').textContent=error.message;return}d.remove();loadPosts()}}}
function post(job=null){window.editJob=job?.id||null;const ar=lang==='ar';$('app').innerHTML=`<div class="card"><h2>${job?(ar?'تعديل الوظيفة':'Edit job'):t('Post a job')}</h2><label>${t('Job title')}</label><input id="jt" maxlength="200" value="${esc(job?.title||'')}"><label>${t('Company')}</label><input id="jcompany" maxlength="200" value="${esc(job?.company_name||prof.name)}"><label>${t('Location')}</label><input id="jlo" value="${esc(job?.location||'')}"><label>${t('Type')}</label><select id="jy">${['Full-time','Part-time','Contract','Internship'].map(x=>`<option ${job?.job_type===x?'selected':''}>${x}</option>`).join('')}</select><label>${t('Description')}</label><textarea id="jd" rows="5" maxlength="10000">${esc(job?.description||'')}</textarea><label>${ar?'طريقة التقديم: platform أو رابط https أو بريد إلكتروني':'Apply method: platform, https link or email'}</label><input id="jmethod" value="${esc(job?.apply_method||'platform')}"><p class="help">${ar?'platform يستقبل الطلبات داخل الموقع.':'platform receives applications on this site.'}</p><p id="jobmsg" role="status"></p><button class="btn" onclick="addJob()">${job?t('Save'):t('Publish')}</button></div>`}
async function addJob(){const title=$('jt').value.trim(),company_name=$('jcompany').value.trim(),description=$('jd').value.trim(),method=$('jmethod').value.trim()||'platform';if(!title||!company_name||!description){$('jobmsg').textContent=lang==='ar'?'أكمل العنوان والشركة والوصف.':'Fill title, company and description.';return}if(method!=='platform'&&!/^https:\/\/[^\s]+$/.test(method)&&!/^\S+@\S+\.\S+$/.test(method)){$('jobmsg').textContent='Use platform, an https URL or an email address.';return}const u={title,company_name,description,location:$('jlo').value.trim(),job_type:$('jy').value,apply_method:method};const {error}=window.editJob?await sb.from('jobs').update(u).eq('id',window.editJob).eq('company_id',me.id):await sb.from('jobs').insert({...u,company_id:me.id});if(error){$('jobmsg').textContent=error.message;return}go('jobs')}
async function loadJobs(){const q=($('q')?.value||'').toLowerCase();const {data:js,error}=await sb.from('jobs').select('*,profiles(name,verified)').order('created_at',{ascending:false});if(error){$('jl').textContent=error.message;return}window.loadedJobs=js||[];const {data:ap}=await sb.from('applications').select('job_id').eq('applicant_id',me.id);const applied=new Set((ap||[]).map(x=>x.job_id));$('jl').innerHTML=(js||[]).filter(j=>(!j.closed||j.company_id===me.id)&&(j.title+' '+(j.company_name||j.profiles.name)).toLowerCase().includes(q)).map(j=>`<div class="card"><h3>${esc(j.title)} ${j.closed?`<span class="tag">${lang==='ar'?'مغلقة':'Closed'}</span>`:''}</h3><p>${esc(j.company_name||j.profiles.name)} · ${esc(j.location)} · ${esc(j.job_type)}</p><p class="muted">${lang==='ar'?'نشر بواسطة':'Posted by'} ${lk(j.company_id,j.profiles.name,j.profiles.verified)}</p><p style="white-space:pre-wrap">${esc(j.description)}</p>${j.company_id===me.id?`<button class="btn o" onclick="post(window.loadedJobs.find(x=>x.id===${j.id}))">${lang==='ar'?'تعديل':'Edit'}</button> <button class="btn o" onclick="toggleJob(${j.id},${!j.closed})">${j.closed?(lang==='ar'?'إعادة فتح':'Reopen'):(lang==='ar'?'إغلاق':'Close')}</button> <button class="btn" onclick="applicants(${j.id})">${lang==='ar'?'المتقدمون':'Applicants'}</button>`:!j.closed?(j.apply_method&&j.apply_method!=='platform'?`<a class="btn" href="${esc(j.apply_method.startsWith('https://')?j.apply_method:'mailto:'+j.apply_method)}" target="_blank" rel="noopener">${t('Apply')} ↗</a>`:`<button class="btn" ${applied.has(j.id)?'disabled':''} onclick="apply(${j.id})">${applied.has(j.id)?t('Applied ✓'):t('Apply')}</button>`):''}</div>`).join('')||`<div class="card muted">${t('No jobs yet.')}</div>`}
async function toggleJob(id,closed){const {error}=await sb.from('jobs').update({closed}).eq('id',id).eq('company_id',me.id);if(!socialError(error))loadJobs()}
async function apply(id){const {error}=await sb.from('applications').insert({job_id:id,applicant_id:me.id});if(!socialError(error))loadJobs()}
async function applicants(id){const {data,error}=await sb.from('applications').select('applicant_id,created_at,profiles(name,headline,verified)').eq('job_id',id).order('created_at',{ascending:false});$('app').innerHTML=`<button class="btn o" onclick="go('jobs')">${t('Back')}</button><div class="card"><h2>${lang==='ar'?'المتقدمون':'Applicants'}</h2>${error?esc(error.message):(data||[]).map(a=>`<p>${lk(a.applicant_id,a.profiles.name,a.profiles.verified)}<br>${esc(a.profiles.headline||'')}<br><button class="btn o" onclick="chatWith='${a.applicant_id}';go('msgs')">${t('Message')}</button></p>`).join('')||`<p>${t('None yet.')}</p>`}</div>`}

async function savePost(id,on){const {error}=on?await sb.from('bookmarks').delete().eq('post_id',id).eq('user_id',me.id):await sb.from('bookmarks').insert({post_id:id,user_id:me.id});if(!socialError(error))loadPosts()}
async function repost(id,on){const d=document.createElement('dialog');d.className='cropdialog';d.innerHTML=`<h2>${lang==='ar'?'إعادة نشر':'Repost'}</h2><p>${on?(lang==='ar'?'إلغاء إعادة النشر؟':'Remove your repost?'):(lang==='ar'?'إعادة نشر هذا المنشور لمتابعيك؟':'Repost this post to your followers?')}</p><button class="btn" id="confirmrepost">${lang==='ar'?'تأكيد':'Confirm'}</button> <button class="btn o" onclick="this.closest('dialog').remove()">${t('Cancel')}</button><p role="status"></p>`;document.body.append(d);d.showModal();d.querySelector('#confirmrepost').onclick=async()=>{const {error}=on?await sb.from('reposts').delete().eq('post_id',id).eq('user_id',me.id):await sb.from('reposts').insert({post_id:id,user_id:me.id});if(error){d.querySelector('[role=status]').textContent=error.message;return}d.remove();loadPosts()}}
async function externalShare(id){const url=location.origin+location.pathname+'?post='+id;try{if(navigator.share)await navigator.share({title:'Recrova Talent',url});else{await navigator.clipboard.writeText(url);alert(lang==='ar'?'تم نسخ رابط المنشور.':'Post link copied.')}}catch(e){if(e.name!=='AbortError')alert(e.message)}}
async function savedPosts(){window.onlySaved=true;page='feed';await feed()}

async function loadProfileReposts(id){const {data:rs,error}=await sb.from('reposts').select('post_id,created_at').eq('user_id',id).order('created_at',{ascending:false}).limit(50);if(error||!rs?.length)return;const [{data:actor},{data:ps}]=await Promise.all([sb.from('profiles').select('id,name,headline,avatar_path,photo_frame,verified').eq('id',id).single(),sb.from('posts').select('id,body,image_path,author_id,profiles!posts_author_id_fkey(name,verified)').in('id',rs.map(r=>r.post_id))]);if(!actor)return;const map=Object.fromEntries((ps||[]).map(p=>[p.id,p]));const box=document.createElement('div');box.className='card';box.innerHTML=`<h3>${lang==='ar'?'إعادة النشر':'Reposts'}</h3>`+rs.map(r=>{const p=map[r.post_id];return p?`<article class="expitem"><div class="row"><span class="av">${avatar(actor)}</span><div><b>${lk(id,actor.name,actor.verified)}</b><div class="muted">${esc(actor.headline||'')}</div><small>${lang==='ar'?'أعاد النشر':'Reposted'}</small></div></div><div class="card" style="margin-top:12px"><b>${lk(p.author_id,p.profiles.name,p.profiles.verified)}</b><p>${esc(p.body)}</p>${postImage(p.image_path)}<a href="?post=${p.id}">${lang==='ar'?'فتح المنشور':'Open post'}</a></div></article>`:''}).join('');if(page==='profile'||(page==='user'&&viewId===id))$('app').append(box)}

setInterval(poll,20000);
init();applyLang();
</script></body></html>
